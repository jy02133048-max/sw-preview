<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SW Stone Library — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--serif:'Cormorant Garamond',serif;--ui:'DM Sans',sans-serif}
body{margin:0;background:radial-gradient(120% 80% at 50% -10%,#1a1530 0%,#0c0a14 55%,#08060e 100%);min-height:100vh}
.sw-lib{--gold:#E3BC77;--ink:#F1E7D6;--body:#C8B79E;--muted:#8C7E6B;--panel:rgba(255,255,255,.04);--line:rgba(241,231,214,.12);
  font-family:var(--ui,'DM Sans',sans-serif);color:var(--body);max-width:1200px;margin:0 auto;padding:64px 24px;position:relative}
.sw-lib *{box-sizing:border-box}
.sw-lib__head{text-align:center;max-width:640px;margin:0 auto 40px}
.sw-lib__eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:0 0 14px;opacity:.9}
.sw-lib__title{font-family:var(--serif,'Cormorant Garamond',serif);font-weight:500;font-size:clamp(2.4rem,5vw,3.4rem);color:var(--ink);margin:0 0 16px;line-height:1.05}
.sw-lib__intro{font-size:16px;line-height:1.7;color:var(--body);margin:0}
.sw-lib__filters{display:flex;flex-direction:column;gap:12px;margin:0 0 32px;align-items:center}
.sw-lib__frow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.sw-lib__flabel{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.sw-chip{border:1px solid var(--line);background:transparent;color:var(--body);border-radius:999px;padding:7px 15px;font-size:13px;
  font-family:inherit;cursor:pointer;transition:.18s;letter-spacing:.02em}
.sw-chip:hover{border-color:var(--gold);color:var(--ink)}
.sw-chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1410;font-weight:600}
.sw-chip--el[aria-pressed="true"]{background:var(--elc);border-color:var(--elc);color:#11100f}
.sw-chip--el::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--elc);margin-right:7px;vertical-align:middle}
.sw-lib__count{text-align:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 24px}
.sw-lib__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.sw-card{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px 14px 16px;text-align:center;
  cursor:pointer;transition:.2s;overflow:hidden}
.sw-card:hover{border-color:rgba(227,188,119,.5);transform:translateY(-2px);background:rgba(255,255,255,.06)}
.sw-card__bead{width:88px;height:88px;margin:0 auto 12px;border-radius:50%;object-fit:cover;display:block;
  box-shadow:0 6px 20px rgba(0,0,0,.45)}
.sw-card__name{font-family:var(--serif,'Cormorant Garamond',serif);font-size:18px;color:var(--ink);line-height:1.15;margin:0 0 4px;font-weight:500}
.sw-card__teaser{font-size:12.5px;line-height:1.5;color:var(--muted);margin:8px 0 0;min-height:38px}
.sw-card__el{position:absolute;top:12px;right:12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--elc);
  border:1px solid var(--elc);border-radius:999px;padding:2px 8px;opacity:.85}
.sw-lib__empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px;font-size:15px}
/* drawer */
.sw-drawer{position:fixed;inset:0;z-index:90;display:none}
.sw-drawer.open{display:block}
.sw-drawer__scrim{position:absolute;inset:0;background:rgba(8,6,14,.66);backdrop-filter:blur(3px)}
.sw-drawer__panel{position:absolute;top:0;right:0;height:100%;width:min(460px,92vw);background:#100d18;border-left:1px solid var(--line);
  padding:36px 30px;overflow-y:auto;transform:translateX(20px);opacity:0;transition:.28s}
.sw-drawer.open .sw-drawer__panel{transform:none;opacity:1}
.sw-drawer__x{position:absolute;top:18px;right:18px;background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
.sw-drawer__bead{width:120px;height:120px;border-radius:50%;object-fit:cover;display:block;margin:6px auto 18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sw-drawer__name{font-family:var(--serif,'Cormorant Garamond',serif);font-size:28px;color:var(--ink);text-align:center;margin:0 0 2px;font-weight:500}
.sw-drawer__cn{text-align:center;color:var(--muted);font-size:13px;margin:0 0 14px}
.sw-drawer__tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 24px}
.sw-tag{font-size:11px;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--body)}
.sw-tag--el{color:var(--elc);border-color:var(--elc)}
.sw-field{margin:0 0 18px}
.sw-field__k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.sw-field__v{font-size:14.5px;line-height:1.75;color:var(--body);margin:0}
.sw-drawer__cta{display:block;text-align:center;margin-top:26px;background:var(--gold);color:#1a1410;font-weight:600;border-radius:999px;
  padding:14px;text-decoration:none;font-size:15px;letter-spacing:.02em}
.sw-drawer__cta:hover{filter:brightness(1.06)}
@media(max-width:560px){
  .sw-lib{padding:44px 16px}
  .sw-lib__grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .sw-drawer__panel{width:100vw;top:auto;bottom:0;height:88vh;border-left:none;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    transform:translateY(24px)}
  .sw-drawer.open .sw-drawer__panel{transform:none}
}</style></head><body>


<div class="sw-lib-root">
<section class="sw-lib">
  <header class="sw-lib__head">
    <p class="sw-lib__eyebrow">96 stones · every one real</p>
    <h1 class="sw-lib__title">The Stone Library</h1>
    <p class="sw-lib__intro">Every stone we carry, and what it is actually for. No two are the same — pick by feel, by element, or by what you are walking into.</p>
  </header>

  <div class="sw-lib__filters">
    <div class="sw-lib__frow"><span class="sw-lib__flabel">Element</span><button class="sw-chip sw-chip--el" data-facet="el" data-val="metal" aria-pressed="false" style="--elc:#C9C6D6">Metal</button><button class="sw-chip sw-chip--el" data-facet="el" data-val="wood" aria-pressed="false" style="--elc:#2E8B84">Wood</button><button class="sw-chip sw-chip--el" data-facet="el" data-val="water" aria-pressed="false" style="--elc:#8AC2E2">Water</button><button class="sw-chip sw-chip--el" data-facet="el" data-val="fire" aria-pressed="false" style="--elc:#C97987">Fire</button><button class="sw-chip sw-chip--el" data-facet="el" data-val="earth" aria-pressed="false" style="--elc:#E3BC77">Earth</button></div>
    <div class="sw-lib__frow"><span class="sw-lib__flabel">For</span><button class="sw-chip" data-facet="wish" data-val="calm" aria-pressed="false">calm</button><button class="sw-chip" data-facet="wish" data-val="career" aria-pressed="false">career</button><button class="sw-chip" data-facet="wish" data-val="communication" aria-pressed="false">communication</button><button class="sw-chip" data-facet="wish" data-val="confidence" aria-pressed="false">confidence</button><button class="sw-chip" data-facet="wish" data-val="energy" aria-pressed="false">energy</button><button class="sw-chip" data-facet="wish" data-val="focus" aria-pressed="false">focus</button><button class="sw-chip" data-facet="wish" data-val="grounding" aria-pressed="false">grounding</button><button class="sw-chip" data-facet="wish" data-val="intuition" aria-pressed="false">intuition</button><button class="sw-chip" data-facet="wish" data-val="love" aria-pressed="false">love</button><button class="sw-chip" data-facet="wish" data-val="protection" aria-pressed="false">protection</button><button class="sw-chip" data-facet="wish" data-val="self_love" aria-pressed="false">self_love</button><button class="sw-chip" data-facet="wish" data-val="sleep_light" aria-pressed="false">sleep_light</button><button class="sw-chip" data-facet="wish" data-val="wealth" aria-pressed="false">wealth</button></div>
  </div>
  <p class="sw-lib__count" id="swLibCount"></p>

  <div class="sw-lib__grid" id="swLibGrid"></div>
</section>

<div class="sw-drawer" id="swDrawer" aria-hidden="true">
  <div class="sw-drawer__scrim"></div>
  <div class="sw-drawer__panel">
    <button class="sw-drawer__x" aria-label="Close">&times;</button>
    <div id="swDBody"></div>
  </div>
</div>

<script type="application/json" id="swStoneData">[{"id":"jx-001","cn":"白幽灵水晶手串","en":"White Phantom Quartz","el":"metal","color":"white_neutral","wish":["energy","intuition"],"teaser":"它不替你理清脑子——是给\"想把事情放空、重新排一遍\"的那个念头一个落点","material":"近乎无色的透白水晶(lch 明度 83、彩度 0——基本不带任何颜色),里面飘着一层层云雾状的白色\"幽灵\"包裹体:那是水晶生长时停了又长留下的旧轮廓,像冻在透明里的一层薄雾。所以它不是亮晶晶的玻璃透,是带着内部纹路的\"有故事的透\"——光进去会被那层雾轻轻挡一下。透白底,适合当一串里留白、透气的那颗,不抢戏。","tradition":"(传统说法,非科学)白水晶在中式与水晶圈里被当成\"净化、放大、把杂念理清\"的百搭石;而\"幽灵\"那一层层内含,lore 里常系在\"一层层走过来、阶段更替、新开始\"上——把过去叠在身体里,再往上长一节。","colorPsych":"(Heller/通用色彩心理)白=干净、留白、从头开始的颜色,是减法不是加法;它不替你说话,而是把噪音降下来。但白幽灵不是死白——那层游移的雾让这份\"空\"带着深度,像一张刚擦干净、还留着旧痕的纸。","benefit":"它不替你理清脑子——是给\"想把事情放空、重新排一遍\"的那个念头一个落点。给那种被太多声音填满、想腾一格出来的人:把这颗透白摆在你低头看得见的地方,提醒自己——有些位置,空着也是一种安排。","element":"补金(盘缺金/需要肃清、收束、把杂事理出条理的人);也是库里少见的金属性石,五行偏金的盘几乎只能落在它身上。"},{"id":"jx-002","cn":"白水幽灵手串","en":"White Garden Quartz","el":"metal","color":"white_neutral","wish":["calm","energy","focus","intuition"],"teaser":"它不让你的脑子变清楚——是给\"想把一团乱先放下、空出一格\"的那个念头一个看得见的落点","material":"通透的水晶里裹着一层雾白的内含物——像封进石头的云絮或薄霜,不是那种一眼到底的全透珠子。Lab 算下来近乎无彩(L≈88、彩度趋零),所以它是冷白偏中性的\"白\",光进去会被里头的絮状物散开,雾蒙蒙地亮,不刺眼。每颗内含的走向都不一样,等于没有两颗长得完全相同。","tradition":"(传统说法,非科学)白水晶在中式 lore 里管\"净化、放大、清晰\",被当百搭的放大石,也常被摆在防小人/化煞这条线上;裹着白色幽灵(内含物)的这种,传统上多解作\"层层累积、把过往收进来\"的成长意象。","colorPsych":"(Heller)白是干净、留白、重新开始的颜色——读作\"空出来、还没被填满\"。这颗不是亮面纯白,而是带雾的白,那层化不开的絮让\"干净\"里多了一点静和远,不冷硬。","benefit":"它不让你的脑子变清楚——是给\"想把一团乱先放下、空出一格\"的那个念头一个看得见的落点。给那种东西堆太满、连一句完整想法都摆不下的人:留一块没被填满的白,在你手腕上。","element":"补金(盘缺金/需要收束、立清楚边界、把杂念过滤掉)。库里属金的石头极少,这颗是金属性里的主力百搭项。"},{"id":"jx-003","cn":"奶白晶","en":"Milky Quartz","el":"metal","color":"white_neutral","wish":["energy","intuition"],"teaser":"它不让你清空脑子——是在一堆有颜色、有情绪的珠子中间,给你留一块\"什么都不必是\"的空白","material":"乳白雾面,不是透明白水晶那种通透——光进去是化开的、像隔着一层奶的柔和,云絮感来自石头里细密的气液包体。lch 彩度为 0、明度很高,所以它是这串里最\"安静\"的一颗:几乎没有颜色,只有干净的浅白。当留白用、当底色用,别指望它抢戏。","tradition":"(传统说法,非科学)水晶大类在 lore 里管\"净化、放大、把杂念理清\";奶白晶是它雾面的那一支,传统里偏向\"柔和的净化\"——不锐,而是像一层底,把旁边珠子的意图衬出来。","colorPsych":"(Heller)白是最干净、最少负担的颜色,读作\"留白、重新开始、把空间让出来\";这颗的雾白还多一层柔,不是冷硬的纯白,而是\"被磨软过的干净\"。一串里一两颗,眼睛就有了喘气的地方。","benefit":"它不让你清空脑子——是在一堆有颜色、有情绪的珠子中间,给你留一块\"什么都不必是\"的空白。给那种总觉得满、想要一点余地的人:把留白摆在你看得见的地方,提醒自己可以先停一下,再放进去。","element":"补金(盘缺金/需要肃清、收束、把杂的理顺)。金属性石本就少,这颗是温和那一版。"},{"id":"jx-004","cn":"白月光手串","en":"White Moonstone","el":"metal","color":"white_neutral","wish":["energy","intuition"],"teaser":"它不让你变得通透或平静——是给\"想从头来过、想听清自己直觉\"的那个念头一个看得见的落点","material":"乳白偏冷的浅色珠,几乎不带颜色(明度高、彩度极低)——抛光后好的料子会在表面浮一层游移的青白光(行话叫\"月晕\"),转一下从珠子里滑过去;但要诚实:这层晕看料,普货可能只是哑哑的一片奶白,没那么会\"自己发光\"。它是这串里最素、最往后退的一颗。","tradition":"传统说法(lore,非科学):月光石在多个文化里被当作\"直觉、新开始、夜路护符\",白月光尤其系在\"安抚情绪、看清心里那点说不出的东西\"上。本系统库里没有这个具体品种的考据,以上是月光石大类公认的民俗象征,不作功效承诺。","colorPsych":"乳白/接近白(Heller):白读作干净、留白、重新开始——是把杂音清掉的颜色,而不是往里加东西。这颗几乎没有色相,所以它在一串里的作用是\"让别的颜色喘口气\";那层若有若无的冷青晕,又给这片白添了一点梦感,不至于冷得像瓷砖。","benefit":"它不让你变得通透或平静——是给\"想从头来过、想听清自己直觉\"的那个念头一个看得见的落点。给那种心里乱、又说不清乱在哪的人:把这片素白摆在手腕上,提醒自己留一块不被填满的空。","element":"补金(盘缺金/需要收敛、肃静、把发散的劲收回来)。库里金属性石头本就少,这颗是为数不多能补金的素色选项。"},{"id":"jx-005","cn":"奶白晶水晶","en":"Milky Quartz","el":"metal","color":"white_neutral","wish":["energy","intuition"],"teaser":"它不让你\"变清醒\"——是给\"想把脑子里那团乱先放空一格\"的状态,一个看得见的落点","material":"奶白晶——白水晶的\"起雾\"版:不是透亮通光的那种,是石英里裹了细微气泡和水痕,所以发奶、发蒙,半透到微透之间。lch 明度 84、彩度只有 2,几乎不带颜色,是一颗冷调的乳白珠。表面抛光后温润、不刺眼,像磨砂玻璃透着光,而不是钻石那种闪。诚实说:它不是\"水晶球\"般的纯净透,奶感本身就是它的样子,别指望到手是玻璃透亮的。","tradition":"(传统说法,非科学)白水晶家族在 lore 里管\"净化、放大、把杂念理清\";石英常被当作\"百搭、给其他石头加持\"的基石。奶白晶是它起雾的一支,传统上更偏\"柔化版的清晰\"——同样指向清净,但带一层朦胧的安定感,而非锋利的通透。","colorPsych":"(Heller/通用)白=干净、留白、重新开始,是最少负担、最让人喘口气的颜色;不带彩度意味着它不抢戏。但奶白比纯白多一层雾——它读起来不是\"空白一片\",而是\"蒙着一层柔光的安静\",像晨雾里的留白,而非手术室的惨白。","benefit":"它不让你\"变清醒\"——是给\"想把脑子里那团乱先放空一格\"的状态,一个看得见的落点。给那种一忙起来就满脑子嗡嗡、想要一块干净留白的人:这颗雾白摆在手腕上,就是一处不用解释、可以歇眼的空。","element":"补金(盘缺金/思绪杂、需要收束与清理);也作中性百搭珠,给一串过满的配色留白降噪。"},{"id":"jx-006","cn":"雪花幽灵水晶","en":"Snowflake Phantom Quartz","el":"metal","color":"white_neutral","wish":["energy","intuition"],"teaser":"它不让你\"清空烦恼\"——是给\"想把事情一层层理顺、慢慢来\"的那种心情一个看得见的落点","material":"透明水晶里悬着一层层雪白絮状包裹体——像冻住的雪花封进了玻璃。整颗很亮、很浅（L83），几乎不带颜色（彩度近 0），所以它不是\"白珠子\"，是\"清水里飘着白雾\"那种半透。雪花是天然矿物包体，颗颗分布不一样，不是磨出来的花纹；近看有点棉、有点云絮，别期待全透无杂——那层雪本身就是它的样子。","tradition":"（传统说法，非科学）幽灵水晶在 lore 里管\"一层一层往上长\"——包体被看成水晶生长的年轮，象征积累、阶段、慢慢成形的事。母族白水晶（金）传统associations=净化、放大、把杂念理清；雪花这一支偏\"安静、收束、归零\"的清冷意味。以上均为民间象征，不是功效。","colorPsych":"（Heller）白是\"还没写字的那张纸\"——读作干净、留白、重新开始；多数人把白联想到纯净与秩序。这颗几乎无彩度，所以它在一串里不抢戏，是负责\"喘口气\"的那颗：旁边颜色越满，它越像一道留白。","benefit":"它不让你\"清空烦恼\"——是给\"想把事情一层层理顺、慢慢来\"的那种心情一个看得见的落点。给那种东西堆太满、想给自己留一块空白的人：把它摆在腕上低头能看见的地方，提醒你不必每格都填满。","element":"补金（盘缺金/思绪散乱、需要收束与界限感）；水晶家族属金，主\"清\"与\"理\"。"},{"id":"jx-007","cn":"白幽灵水晶手串","en":"White Phantom Quartz","el":"metal","color":"white_neutral","wish":["energy","intuition"],"teaser":"它不让你\"变清醒\"——是给那团乱给一个落点:层层往上的幽灵摆在手腕上,提醒你现在这步也是长出来的一层","material":"近乎无色的乳白水晶,L=86 很亮、彩度几乎为零(C=1)——不是亮晶晶的玻璃透,是带一层雾的白,像呵了气的玻璃。\"幽灵\"在它里头:水晶生长时停一停又长,把一层薄薄的白絮包进去,所以你会看到珠子内部有若隐若现的层、影、小山形,不是表面花纹,是冻在里面的生长痕。每颗的\"幽灵\"长得都不一样,别指望两颗对称。","tradition":"(传统说法,非科学)白水晶在水晶文化里管\"净化、放大、把杂的理清\";幽灵/异象水晶因为内部那层包裹,传统上被讲成\"记录成长、一层一层往上走\"的石头——把过去封在里面、人继续往上长。归在石英大类的公认 lore,白幽灵这个具体品种古籍无专条,以上是大类说法。","colorPsych":"(Heller/通用)白=干净、留白、重新开始,是最不抢戏的颜色——心理上读作\"清空、可以从头\"。这颗的雾白又比纯透的白多一分柔:不是刺眼的纯白,是带呼吸感的奶白,看着像把噪音调小了一格。","benefit":"它不让你\"变清醒\"——是给那团乱给一个落点:层层往上的幽灵摆在手腕上,提醒你现在这步也是长出来的一层。给那种事情堆太多、想先把桌面清空再开始的人:一颗安静的白,占着\"重来一次\"的位置。","element":"补金(盘缺金/需收束、决断、把发散的理出条理)。库里金属性极少,这颗是少数能补金的白石。"},{"id":"jx-008","cn":"奶茶月光","en":"Champagne Moonstone","el":"metal","color":"white_neutral","wish":["energy","intuition","self_love","wealth"],"teaser":"它不让你变温柔——是给\"对自己好一点\"这件常被排到最后的事,一个放在手腕上、低头就看得见的提醒","material":"奶茶色的月光石——不是冷白透,是带一点暖的燕麦/奶茶米色(lch 偏暖、彩度极低)。底子半透不透,转动时浮一层很淡的奶光,不像蓝月光那样跳一道蓝,而是闷在里头的柔。库里最\"中性\"的一颗,不抢戏:它是把一串收住、垫底的那种珠,不是 hero。","tradition":"(传统说法,非科学)月光石属长石家族,那层游移的光叫\"晕彩\"。lore 里月光石管直觉、新开始、是旅人的护符;暖调的这支常被系在\"自我接纳、温柔待己\"上,不像蓝调那么外放。","colorPsych":"(Heller)暖米/奶茶色读作安心、亲近、不端着的高级——它不是要被看见,是让人想靠近。低饱和的暖中性正是\"不喧哗的贵气\":它给整串当 70-85% 的中性底,反衬出别颗的彩。","benefit":"它不让你变温柔——是给\"对自己好一点\"这件常被排到最后的事,一个放在手腕上、低头就看得见的提醒。给那种照顾所有人、唯独漏了自己的人:一颗不刺眼、却一直在的暖。","element":"补金(盘缺收敛/界限感、需要一点\"定与清\")。库里金属性石极少,这颗暖白可作金的柔性补位。"},{"id":"jx-009","cn":"白阿塞水晶","en":"Azeztulite Quartz","el":"metal","color":"white_neutral","wish":["energy","intuition"],"teaser":"它不让你\"变清醒\"——是在一堆颜色里留一块空白,给那种脑子太满、想清出一格的人一个落点","material":"近乎无色的白水晶,带一点点冷调灰蓝——不是冰蓝,是光进去后微微发凉的那种白(lch 明度高、彩度极低)。透而不闪,质感安静干净;别指望它像有色石那样\"跳\",它是一串里负责留白、把别的颜色衬出来的那颗。所谓\"阿塞/Azeztulite\"是商品名,本体就是石英(白水晶)一族,别被名字唬住。","tradition":"传统说法(非科学):白水晶在玄学里归\"净化、放大、清晰\"——被当作能\"理顺、放大旁边石头能量\"的百搭石,也常说与专注、直觉相系。这些都是 lore,不是已证实功效;\"阿塞水晶\"近年被赋予的\"高频/扬升\"叙事尤其属营销与信仰范畴,保守对待。","colorPsych":"挂 Heller/通用色彩心理:白=干净、留白、重新开始,是最不施压的颜色。这颗的冷白≠惨白病房白——带一丝灰蓝,读作\"清醒、有余地\",像一口深呼吸后的空。它的作用是给眼睛一个歇脚处,让满串不至于吵。","benefit":"它不让你\"变清醒\"——是在一堆颜色里留一块空白,给那种脑子太满、想清出一格的人一个落点。把它戴在看得见的地方:提醒自己,留白也是一种秩序,不必每一格都填满。","element":"补金(盘缺金/需收束、立规矩、理清杂念时)。内部用:也常作\"放大/中和\"位,百搭不抢戏。"},{"id":"jx-010","cn":"A级白水晶","en":"Clear Quartz","el":"metal","color":"white_neutral","wish":["energy","intuition"],"teaser":"它不让你头脑变清醒——是给\"想清空、重新理一遍\"的那个念头一个落点","material":"几乎无色的透明珠,带极淡的暖灰底(不是雪白,是清水那种白)。A级=干净、内部杂质少,光直接穿过去——它不抢色,是把光让出来的那颗。一串里最\"透气\"的留白位。","tradition":"传统说法(非科学):白水晶在中式里管\"净化、放大、清晰\"——被叫作百搭的\"放大器\",传统认为它能把旁边石头的意思衬得更明。属金。","colorPsych":"无色透明≈白的逻辑(Heller):白读作干净、清空、重新开始;没有颜色本身就是一种\"留白\",让眼睛和心都松一格。它在串里的作用不是说话,是给别的颜色腾出空气。","benefit":"它不让你头脑变清醒——是给\"想清空、重新理一遍\"的那个念头一个落点。给那种东西太满、想留一块空白的人:把这颗透的摆进来,让旁边的色块有地方喘气。","element":"补金(盘缺金/需要肃清、定界、把杂的收干净);也是百搭的中性放大位,衬旁边那颗主石。"},{"id":"jx-011","cn":"A白水晶","en":"Clear Quartz","el":"metal","color":"white_neutral","wish":["energy","intuition"],"teaser":"它不让你头脑变清醒——是在一串花色里留出一块\"什么都不是\"的空地，提醒你不必每颗珠子都用力","material":"近乎无色的透——L85/彩度2，几乎没有颜色，就是干净的玻璃质透白，不是奶白也不是雪白。抛光后清亮见底，光直接穿过去；它在一串里是\"留白\"那颗，不抢戏，衬得旁边的彩珠更跳。透得越纯越显素净，稍有天然云絮反而是真货的痕，不是瑕。","tradition":"传统说法(lore，非科学)：白水晶在中式水晶语境里被叫作\"百搭石\"，传统associations是净化、放大、清晰——既被当作\"把杂气滤掉\"的清场石，也被当作\"放大旁边石头力量\"的搭配位；犯太岁、化煞时常被摆来当中性的\"压一压\"。这些是民俗象征，不是功效。","colorPsych":"透明/无色在色彩心理里读作\"干净、清晰、无负担\"——它不带情绪色相，所以不替你定调，反而像一块空白，让你自己往上放东西。跟死白≠透白是两回事：死白是封住，透白是\"看得穿、没藏着\"。","benefit":"它不让你头脑变清醒——是在一串花色里留出一块\"什么都不是\"的空地，提醒你不必每颗珠子都用力。给那种容易被太多事填满、想给自己留一格空的人：把\"干净\"摆在手腕上看得见的地方。","element":"补金(盘缺金/需要收束、决断、肃清的人)。库存里金属性只此一颗，所以它常被当作中性放大位，搭谁都不冲。"},{"id":"jx-012","cn":"冰感彩萤石浓色","en":"Fluorite","el":"wood","color":"multicolor","wish":["calm","career","focus","intuition","love"],"teaser":"它不让你专注——是给\"想把一团乱理出条理\"的那股劲一个落点","material":"彩萤石是带状的——同一颗里常有绿、紫、青在层间过渡，玻璃质半透，光照进去是冷冷的水感，不是那种实心闷光。但说实话：这颗\"浓色\"测出来其实偏灰雾（L56·彩度才4），近看是带一点紫灰的安静色，不是糖果那种跳的彩。还有，萤石本身偏软，是娇气的一颗，别当耐磨石使。","tradition":"（传统说法，非科学）萤石在西方水晶 lore 里被叫\"the genius stone\"，管\"理清思路、专注、把乱的念头排好序\"；绿萤石那一支尤其系在\"成长、疗愈、心灵整理\"上。彩色带的萤石则被说成同时收着几路安定的劲。","colorPsych":"（Heller / 通用色彩心理）绿是生长与疗愈、读作\"喘口气\"；紫是神秘内省。这颗灰雾紫调把两者都压低了一格——不抢眼，反而像桌上那块让人愿意盯久一点、慢慢冷静下来的颜色。它的\"点\"不在艳，在静。","benefit":"它不让你专注——是给\"想把一团乱理出条理\"的那股劲一个落点。给那种脑子总同时开七个窗口的人：把它摆在手腕上低头看得见的地方，提醒自己一次只关一扇门。","element":"补木（盘缺生长/疏泄之气、容易钻牛角尖需要舒展）。库里木属性极少，这颗是难得的木。"},{"id":"jx-013","cn":"浓郁色碧玺","en":"Tourmaline","el":"wood","color":"multicolor","wish":["calm","career","energy","focus","self_love","wealth"],"teaser":"它不会给你\"能量\"——是给那种被生活磨得有点钝、想慢慢把劲儿养回来的人一个落点：把这抹温吞的暖米色摆在手腕上你看得见的地方，提醒自己今天…","material":"名字叫\"浓郁色\"，但这颗的真实色值是一抹暖暖的灰褐/驼米（L63 中明度、彩度只有 15、色相偏暖黄），不是想象里那种斑斓鲜艳的彩碧玺。它读作温润的米褐，像被磨柔了的木头色——克制、耐看，不抢戏。碧玺常带细微色带与内部纹理，别指望玻璃般纯净通透。预览即到手货：它是低调暖色的那一颗，不是花哨那颗。","tradition":"（传统说法/lore，非科学）碧玺在珠宝与民间传统里被当作\"能量石\"，常说法是吸纳浊气、护身、带来活力与财富气场；木属性在中式五行里对应生长、舒展、向上。库里无此具体品种条目，以上为碧玺大类的公认 lore。","colorPsych":"（Heller/通用色彩心理）暖灰褐属大地色系，读作踏实、安稳、可亲近——不是刺激色，是让人放松不设防的\"中性暖\"。一个点：这种低彩度的暖棕最适合当整串的底色背景，衬得旁边的高彩珠更亮，自己却不吵。","benefit":"它不会给你\"能量\"——是给那种被生活磨得有点钝、想慢慢把劲儿养回来的人一个落点：把这抹温吞的暖米色摆在手腕上你看得见的地方，提醒自己今天不必硬撑、也不会熄火。给想稳住节奏、不靠亢奋撑场子的人。","element":"补木（盘缺生发之气/做事难起头、易僵住时），木主舒展生长，给停滞的盘一点\"往上长\"的方向。内部用。"},{"id":"jx-014","cn":"天然碧玺","en":"Tourmaline","el":"wood","color":"multicolor","wish":["calm","career","energy","focus","self_love","wealth"],"teaser":"它不让你专注——是给那种\"心很满、想抓的事太多\"的人一个落点:把这颗踏实的暖褐摆在手腕上看得见的地方,提醒自己先定住、再往一个方向走","material":"这颗不是杂志里那种水西瓜碧玺——库里这颗是低彩度的暖褐茶色(lch 明度 49、彩度才 15),偏哑、偏沉,像泡过茶的烟晶感,不是透亮的糖果色。天然碧玺常带细小内含与隐约纹理,所以同一串里两颗也不会完全一样。要的是那种\"低调有内容\"的暖,不是亮闪闪。","tradition":"(传统说法,非科学;碧玺不在专库,以下用碧玺大类公认 lore)碧玺在民间被叫作\"愿望之石 / 净化之石\",传统里讲它\"挡杂气、稳心神、把人定在自己这边\";多色碧玺尤其被说成\"不同颜色管不同方向的能量\",是一颗被赋予\"广纳\"意味的石头。","colorPsych":"(Heller/通用色彩心理)它落在暖褐茶色区:褐色是大地、木头、可靠与踏实的颜色,读作\"不抢戏、待得住\"。低饱和的暖褐尤其有种\"已经安顿好\"的稳——不是热烈的暖,是有底气的暖。","benefit":"它不让你专注——是给那种\"心很满、想抓的事太多\"的人一个落点:把这颗踏实的暖褐摆在手腕上看得见的地方,提醒自己先定住、再往一个方向走。给想稳稳生长、不靠硬撑的人。","element":"补木(盘缺生长/缺舒展、想立事业却起不来那股劲)。木主生发、条达,这颗的暖褐对应\"扎根再向上\"的那一路。"},{"id":"jx-015","cn":"天然聚宝盆兔毛","en":"天然聚宝盆兔毛","el":"wood","color":"multicolor","wish":["confidence","energy"],"teaser":"它不会替你把钱招来——是把\"该攒的、该握住的\"那股劲,做成一颗你低头就看得见的东西","material":"\"聚宝盆兔毛\"是带金红石内含的发晶——透白底里横七竖八封着一蓬金棕色的细丝,像凝住的草根。这颗整体不亮:lch 明度才 44、彩度只 25,所以看着是闷闷的暖棕,不是金灿灿。丝的疏密、走向每颗都不一样,multicolor 指的就是那团丝的层次,不是花花绿绿——预览里你看到的乱丝,到手就是那个样,别指望它像广告里水钻一样透亮。","tradition":"(传统说法,非科学)发晶这一类在民间叫法里被当作\"招财、聚气、护身\"的石头,金丝越密越被说成\"聚宝\";\"兔毛\"是因丝细如毛而得名。库里没有这个具体品种的考据条目,以上是发晶大类的通行 lore,不是这颗经过验证的特性,产地、丝的成分都不做精确承诺。","colorPsych":"暖棕金在色彩心理里靠近大地色:读作踏实、可靠、有分量(黄/暖=暖能量、不张扬的富足感)。它不是会跳出来抢眼的颜色,低彩度让那点金更像\"藏着的暖\",而不是炫耀——一个点:它读起来是\"底气\",不是\"闪\"。","benefit":"它不会替你把钱招来——是把\"该攒的、该握住的\"那股劲,做成一颗你低头就看得见的东西。给那种闷头做事、不爱声张、想给自己留个\"我在往里收\"的提醒的人:把它戴在手上,当那团金丝是你正在攒的东西。","element":"补木(盘缺木/需要生发、攒劲、往上长的人)。那团向各方向伸的金丝,正合木的\"生长、铺开\"意象。"},{"id":"jx-016","cn":"天然满毛彩兔毛","en":"天然满毛彩兔毛","el":"wood","color":"multicolor","wish":[],"teaser":"它不会帮你抓住机会——是把\"细水长流、攒着劲\"这件事放在你手腕上看得见的地方","material":"通透到半透的暖底水晶，里头裹着一层细如兔毛的针状丝——\"满毛\"是说丝够密、\"彩\"是说丝不止一色。整颗 lch 彩度只有 18，是颗低饱和的暖蜜/灰棕调(rgb 偏 taupe)，所以亮点不在颜色本身，而在转动时那层细丝被光挑起来的那一下。是\"近看才发现里头有东西\"的那种珠，不是远远就抢眼的。别期待大金光闪：兔毛是细的、含蓄的，丝粗丝乱的不是这颗。","tradition":"(传统说法，非科学)发晶/兔毛在水晶 lore 里是石英裹金红石类针状物，越细的针越被叫作\"兔毛\"；民间把这类\"内含丝\"的水晶系在\"聚气、招正财、护身气场\"上，丝越满越被看重。彩兔毛因多色丝又被说成\"多向能量、机遇面广\"。这些都是传承说法，不是石头的物理功效。","colorPsych":"(Heller/通用色彩心理)暖棕米调读作踏实、可亲、不端着——是\"靠得住\"那一类的颜色，不是炫的颜色。但暖蜜底 ≠ 土气死板：里头那层细丝给安稳底子加了一点\"在动、在长\"的活气，所以它读出来是\"稳，但没停\"。","benefit":"它不会帮你抓住机会——是把\"细水长流、攒着劲\"这件事放在你手腕上看得见的地方。给那种不靠一锤子、信积累的人：每天那点细丝提醒你，正经攒下来的东西才是你的底气。","element":"补木(盘缺生长/缺舒展、想要慢慢往上长的劲)。暖底带土气，是木里偏温润的一颗，给纯冷盘点一点暖。"},{"id":"jx-017","cn":"超透体彩萤石","en":"Fluorite","el":"wood","color":"multicolor","wish":["career","love"],"teaser":"它不让你头脑变清楚——是把\"一团乱里慢慢分出条理\"的那种感觉,做成一颗看得进去的珠子摆在手腕上","material":"超透的体彩萤石——通透到能看进珠子里头,里面是分层游走的淡紫、浅绿、青蓝带子,像隔着水看的一片轻雾。注意:它是\"柔和体彩\"不是\"霓虹彩\",彩度其实很低(库里这颗 lch 彩度只有 7),色块是淡淡晕开的、不是鲜亮抢眼;通透度才是它的看点。萤石本身偏脆、莫氏硬度低,是温润不是坚硬的那种石头,日常得当娇贵的戴。","tradition":"(传统说法 lore,非科学)萤石在水晶圈一直被当\"理清头脑、收拾心神\"的石头——传统 associations 是成长、疗愈、心灵整理;多彩体彩这种被说成\"把乱的念头分层归位\"。这些是 lore,不是它真有什么功效。","colorPsych":"不是靠某一个色相打人,而是靠\"透\"——淡紫读作神秘安静、浅绿读作生长舒缓、青蓝读作可信冷静,几层淡色在通透里化开,整颗给的是\"层次分明又不吵\"的清。紫的那点尤其在说:有点想往里收、想清静一格。","benefit":"它不让你头脑变清楚——是把\"一团乱里慢慢分出条理\"的那种感觉,做成一颗看得进去的珠子摆在手腕上。给那种心里事多、想把它们一层层摊开理顺的人:乱归乱,你总有个能盯着发会儿呆、缓一格的地方。","element":"补木(盘缺木/缺生长舒展、思路拧成一团需要\"伸展开\"的一面)。"},{"id":"jx-018","cn":"超七多宝三圈手串","en":"Super Seven","el":"wood","color":"multicolor","wish":["career","confidence","energy","focus","intuition","love","protection","wealth"],"teaser":"它不让你变全能——是把\"一颗就够杂、够全\"这件事摆在你看得见的地方","material":"不是亮紫也不是透白——是带灰的暗赭褐(lch 明度48、彩度只有13,极低),底色偏闷红土。这是天然混生矿,一颗里掺着紫、烟灰、半透白和细密的金红色针状包体;不是哪一种纯水晶的鲜艳,是斑驳、灰扑扑、各色搅在一起的\"多宝\"质感。三圈缠绕,珠面看得到内部杂色和棉絮,越看越像一块没被磨平的原矿。","tradition":"传统说法(lore,非科学):超七(Super Seven)被叫作\"七种共生\"的石头——紫水晶、烟晶、白水晶、金红石、针铁矿等天然长在一起,西方水晶圈把它当作\"一石抵多石\"的全能护符,系在直觉、灵性扎根、整合自我上。这是收藏圈与新纪元的象征说法,不是矿物学定论。","colorPsych":"挂 Heller/通用色彩心理:它不属于任何单一色相的干脆——灰赭褐是大地色里最\"低调、耐脏、不抢话\"的那档,读作沉稳、包容、不刻意。多色搅在一起又不鲜艳,给人的不是热闹,是\"什么都装得下\"的厚。它是一串里的压舱色,不是亮点色。","benefit":"它不让你变全能——是把\"一颗就够杂、够全\"这件事摆在你看得见的地方。给那种不想为每件事各配一样东西、想要一个能兜住所有方向的落点的人:乱的时候,有个不挑、不偏、什么都接得住的定点在手腕上。","element":"补木(盘缺生长力/需舒展、向上的人)。多色共生的属性偏杂,内部归到木,主推给五行喜木、想要\"长开\"的盘。"},{"id":"jx-019","cn":"彩萤石","en":"Fluorite","el":"wood","color":"multicolor","wish":["career","love"],"teaser":"它不让你变清醒——是给\"想把脑子里那团乱捋顺\"的念头一个看得见的落点","material":"彩萤石,顾名思义会带紫绿相间的色带——但这颗彩度极低(lch 彩度才 5),别想成糖果色的鲜艳萤石:它更像蒙了一层奶雾的浅灰绿/淡紫,亮度居中(L≈64),通透里发闷,颜色是\"隐约能看见的分层\",不是跳出来的彩虹。莫氏硬度只有 4,本就是偏软的石头,棱角和亮面经不起磕——是温吞、内敛的一颗,不是抢眼货。","tradition":"(传统说法,非科学)萤石在 lore 里被叫作\"心智的石头\",传统 associations 是理清思路、整理杂念、帮人收心;木属性那一脉则系在\"生长、舒展、把卡住的事重新捋顺\"上。多色/彩萤的说法是把这几股劲合在一颗里——库里归在木,管成长与梳理。这些都是民俗象征,不是矿物的科学功效。","colorPsych":"绿在色彩心理里(Heller)读作生长与疗愈、让人松一口气的颜色;紫读作内省与安静的高处。这颗两色都淡、都收着,合起来不是\"鲜\",是\"清\"——像隔着雾看的浅色,人盯久了会自己慢下来,适合用作整串里\"喘口气\"的那颗,而不是焦点。","benefit":"它不让你变清醒——是给\"想把脑子里那团乱捋顺\"的念头一个看得见的落点。给那种事情堆着、心也跟着堵着的人:把这颗淡色摆在手腕上,提醒自己一次只理一根线。","element":"补木(盘里缺生发、容易卡住停滞、需要把事重新舒展开的人)。内部用:木弱者的成长/梳理位。"},{"id":"jx-020","cn":"兔毛萤石","en":"Fluorite","el":"wood","color":"multicolor","wish":["career","love"],"teaser":"它不让你想清楚——是给\"先停下来、把一团乱的念头摊开\"那一下一个落点","material":"灰蓝调的萤石,带丝绒般细密的\"兔毛\"内纹——不是那种通透艳绿的玻璃感萤石,而是一颗低饱和、雾蒙蒙的冷灰珠(色度只有 8,几乎不抢色)。光线斜进去能看见里头一缕缕浅丝,像隔着薄雾看的发丝。整串里它是最安静、最\"退后\"的底色珠,不亮眼,正因为不亮眼才好搭。","tradition":"(传统说法,非科学)萤石在 lore 里被叫作\"理脑的石头\":管整理思绪、清杂念、把乱成一团的念头梳顺;木属对应生长与舒展。那一缕\"兔毛\"丝在民间说法里被系到\"理出一条线、把缠住的东西捋开\"。这些都是传统象征,不是功效。","colorPsych":"冷灰蓝(Heller:蓝=可信、安宁,是最多人偏爱的色)。但这颗饱和度极低,蓝被灰压成了\"雾\"——读起来不是明亮的安宁,而是\"放空、留白\"的那种安静。一个点:它是降噪色,旁边再吵的珠子挨着它都会被收一格。","benefit":"它不让你想清楚——是给\"先停下来、把一团乱的念头摊开\"那一下一个落点。给那种脑子总开着好几个标签页、停不下来的人:把这颗灰雾摆在手腕上你低头就看得见的地方,提醒自己可以先什么都不想一会儿。","element":"补木(盘缺木/思路僵、需要舒展生发的一格)。色冷,也能给火燥的盘降一格。"},{"id":"jx-021","cn":"超七多宝手串1","en":"Super Seven","el":"wood","color":"multicolor","wish":["career","confidence","energy","intuition","love","protection","wealth"],"teaser":"它不让你\"样样都行\"——是把\"七样东西揉在一颗里\"这件事摆在手腕上,提醒你:复杂的人不必只挑一面活","material":"超七是一颗\"混\"出来的石——同一块石英里掺着紫、烟灰、铁红针线般的内含物。所以它不是均匀一色:整体读作哑光的灰褐带一点藕粉(lab L≈55、彩度低),不是商家图里那种鲜紫水晶。光进去是糊的、温的,内部能看到深浅斑驳的丝缕。一颗珠子一个样,这是矿物共生的真实长相,不是瑕疵。","tradition":"传统说法(lore,非科学):超七又叫\"旋律石 Melody Stone\",玩石圈把它当\"七种矿物共生=七种能量一次到齐\"的全能石,系在直觉、灵性提升、整体协调上;底层的紫(紫水晶=平静直觉)、烟晶(烟晶=扎根、卸压)、铁红(活力)各带各的老说法。这些是民间象征,不是事实。","colorPsych":"色彩心理(Heller/通用):它没有单一主色,落在灰褐+藕粉的中性暖区——这一类低饱和、被\"灰\"过一遍的颜色,读作沉稳、不张扬、像用旧了反而踏实。跟纯紫的神秘高贵不是一回事:纯紫是\"往外亮\",这颗是\"往里收的素\"。一个点:它是那种放在一串里不抢戏、却让整串看起来\"有内容\"的底色珠。","benefit":"它不让你\"样样都行\"——是把\"七样东西揉在一颗里\"这件事摆在手腕上,提醒你:复杂的人不必只挑一面活。给那种身上有好几股劲、不想被归成一类的人一个落点:斑驳本身就是完整。","element":"补木(盘缺生发/成长之气、需要把杂劲拢成一股往上长的力)。内部用。"},{"id":"jx-022","cn":"超透体彩萤石","en":"Fluorite","el":"wood","color":"multicolor","wish":["career","love"],"teaser":"它不帮你想清楚——是把\"乱的时候先分一下类\"这件事,做成一颗你能看进去的珠子,摆在低头就看得见的地方","material":"超透体的彩萤石:玻璃感的高透,光能整颗穿过去,里头隐约带着青绿到紫的色带——不是死透的水晶白,是带一点颜色的水透;整颗读起来偏柔和,不是扎眼的艳色。萤石本身偏软,棱角磨得圆,触感温润不冰。库里最\"水灵\"的一颗,通透到放哪都像吸了光;但正因为透,深色珠子挨着它会显得更沉,得给它留点呼吸的位。","tradition":"(传统说法,非科学)萤石在水晶圈被叫\"心智整理石\",传统系在\"理清思绪、收拾杂乱、专注\"上;绿萤石一路尤其挂着成长、疗愈、心灵清扫的 lore。彩萤石把多种色带收进一颗,常被说成\"把乱成一团的念头分门别类\"——这是 lore,不是功效。","colorPsych":"(Heller/通用色彩心理)它的妙处不在艳,在透——色很淡,几乎是被水稀释过的青绿到紫:绿读作生长与疗愈,紫读作内省,合在一颗透珠里,给人\"清醒又安静\"的一个点。能看进去的浅色,读起来比实色更让人放松、像一口能喘的气。","benefit":"它不帮你想清楚——是把\"乱的时候先分一下类\"这件事,做成一颗你能看进去的珠子,摆在低头就看得见的地方。给那种脑子里同时开八个窗口、想找回一条主线的人:看着这层水透的颜色,先慢一格,再开始。","element":"补木(盘缺木/欠生长舒展之气,或需把郁住的劲儿\"长出来、理顺\")。"},{"id":"jx-023","cn":"彩胶花水晶","en":"Angel Hair Quartz","el":"fire","color":"multicolor","wish":["confidence","energy","grounding","protection"],"teaser":"它不会给你能量——是把\"暖一点、敢往前一点\"这股气,做成你低头看得见的一抹活色","material":"暖蜜桃橙的底子(lch 中明度、彩度只到中段),里头浮着一缕缕彩色的丝与花影——这不是天然金红石发晶,是\"彩胶花水晶\":往透明水晶里灌彩胶/做花处理做出来的那种\"会开花\"的效果。看着活泼、价也亲民,但别当成贵价天然发晶——它的好看是人做出来的暖。一颗就够热闹,排多了会显花。","tradition":"(传统说法,非科学)水晶大类在 lore 里管\"放大、聚气、把心思理清\";暖橙这股色,传统上系在\"行动、热乎气、把人往外推一把\"。这颗是合成花料,没有专属古籍象征,沿用的是水晶+暖色的通说,别按天然发晶那套\"招财发丝\"去讲。","colorPsych":"(Heller)暖橙是色彩心理里最\"亲和、不端着\"的一档——读作温度、活气、靠近感,比正红柔、比黄更有人情味。深蜜桃橙≠扎眼荧光橙:它读作\"暖,但没在喊\",凑近看才发现里头还藏着彩花。","benefit":"它不会给你能量——是把\"暖一点、敢往前一点\"这股气,做成你低头看得见的一抹活色。给那种平时偏冷、想给自己添点热闹又不想太张扬的人:一个轻巧的暖落点,提醒你今天可以主动一格。","element":"补火(盘偏冷、缺活力/行动力时点一颗暖橙带温度)。属人造花料,五行角色按其暖橙火相用,内部参考。"},{"id":"jx-024","cn":"浅彩胶花水晶","en":"Angel Hair Quartz","el":"fire","color":"multicolor","wish":["confidence","energy","grounding","protection"],"teaser":"它不让你\"有底气\"——是把\"暖着、托着、不慌\"的那股感觉，垫在一串里当底色","material":"浅暖米金调，几乎不透到半透——里头那些\"胶花\"是细碎的丝状/花状内含或处理纹，像凝在水里没散开的羽。lch 彩度很低(C22)，所以它不抢色：站在串里是\"暖白偏金\"的柔光底，不是亮闪的彩珠。诚实讲：\"胶花水晶\"是商贸叫法，这类多是有人工处理/合成花纹的石英，不是天然净体——它的好看在那层朦胧的丝感，不在通透。","tradition":"(传统说法，非科学)石英家族在中式与西方 lore 里都管\"净化、放大、把杂念理清\"；带丝状内含的\"发晶/天使发\"一路，传统上系在\"聚气、给愿望加一股推力\"。这颗是该大类的柔色版，象征沿用石英的\"清\"与丝纹的\"暖推\"，不主张具体产地或特殊功效。","colorPsych":"(Heller)暖黄米调读作\"亲近、被晒过的安心\"，黄=暖能量、不设防；但低彩度让它不是张扬的明黄——更像旧纸/暖光那种\"温吞的稳\"。浅金米≠刺眼亮黄：它给的是底色的暖，不是焦点的喊。","benefit":"它不让你\"有底气\"——是把\"暖着、托着、不慌\"的那股感觉，垫在一串里当底色。给那种不想靠抢眼撑场、只想让自己舒展开来的人：占个柔和的位置，把更亮的留给该亮的。","element":"补火(盘偏冷/缺一点暖与行动力)；彩度低，适合当暖底而非火的主导。"},{"id":"jx-025","cn":"彩萤石","en":"Fluorite","el":"wood","color":"multicolor","wish":["career","love"],"teaser":"它不让你想通什么——是给\"想把一团乱理出条理\"的那股劲一个落点,摆在你低头看得见的地方","material":"彩萤石,萤石本就是这串里最\"软\"的料(摩氏4),抛光后是半透到微透的。这颗不是想象里那种鲜艳彩虹——lch 彩度只有4,几乎落在灰里:乳灰带一点冷紫调,光照进去能看到内部那种朦胧的层与隐隐的色带,清透但不张扬。当背景珠很稳,想当主角它不够亮。","tradition":"(传统说法,非科学)萤石在 lore 里管\"理清脑子、把乱的整顺\",彩色/多色那一支被说成对应不同层面的清明;库里这一系归在木,系着成长、心灵整理。这些是传统 associations,不是疗效。","colorPsych":"(Heller/通用色彩心理)它不是高饱和的彩,而是冷灰紫——紫读作内省与一点神秘,灰读作中性、留白。整颗的\"一个点\"是:不抢话,像一块给眼睛喘气的安静色,把旁边更亮的珠子衬出来。这颗灰冷彩萤≠想象中扎眼的彩虹萤石。","benefit":"它不让你想通什么——是给\"想把一团乱理出条理\"的那股劲一个落点,摆在你低头看得见的地方。给那种脑子里同时开七个窗口、想先关掉几个的人:一颗安静的、不催你的珠。","element":"补木(盘缺生长/缺条理、需要一股向上理顺的劲)。色冷彩度低,内部用时适合给偏燥的盘降一格。"},{"id":"jx-026","cn":"托帕石","en":"Topaz","el":"water","color":"multicolor","wish":["calm","communication","protection"],"teaser":"它不让你变会说话——是把\"把话理顺再开口\"那一面摆在你看得见的地方","material":"不是大家想的那种透蓝托帕——这颗是暖香槟米色,带点橄榄黄的灰调,半透不透。L76 偏亮、彩度只有 21,所以它读着很\"轻\",像晒淡了的暖光,而不是宝石店那种冒蓝光的托帕。放一串里它是不抢戏的暖底色,负责把别的珠子衬得稳。","tradition":"(传统说法,非科学)托帕石在西方 lore 里是\"把话说清楚\"的石头——传统上系在沟通、把心里那口气理顺、给旅人壮胆上;也有\"赶走阴郁、把人拉回明亮\"的老说法。注意:这颗是暖黄/香槟色系,不是蓝托帕,所以这些象征按托帕石大类看,别套到具体颜色上。","colorPsych":"(Heller)暖黄到米的这一档,色彩心理里读作\"晒到太阳的安心\"——黄=暖能量、亲和、不设防。但它彩度低,不是那种跳出来的明黄;它读作\"已经晒暖了、不刺眼\"的那种暖。近敌切分:暖香槟≠扎眼柠檬黄,前者让人靠近,后者让人眯眼。","benefit":"它不让你变会说话——是把\"把话理顺再开口\"那一面摆在你看得见的地方。给那种心里有话、到嘴边却卡住的人:一个暖色的落点,提醒你不必急,先暖起来再说。","element":"补水(内部用:盘偏火燥、需要降一格把情绪和表达理顺时,它走水);同时颜色偏暖,适合当串里的过渡暖底,不抢主色。"},{"id":"jx-027","cn":"双A级粉晶水晶","en":"Rose Quartz","el":"fire","color":"pink","wish":["confidence","energy","grounding","protection"],"teaser":"它不会让谁更被爱——是把\"对自己也客气一点\"这件事,摆在你低头就看得见的地方","material":"奶粉色,半透到带点云絮的乳浊——不是糖果那种亮粉,是被牛奶兑淡过的暖粉。彩度很低(库里偏柔的一颗),光打进去是漫开的、糊的,不抢眼。双A级粉晶通常带细棉絮,正是这股\"软\"的来源,不是瑕疵。","tradition":"(传统说法,非科学)粉晶在民间被叫作\"爱的石头\",传统 lore 把它系在心轮上,管\"自我关怀、待人柔软、招桃花\";水晶大类则取其\"放大、纯净\"。这些是文化象征,不是疗效。","colorPsych":"(Heller)粉是被减弱、被调软的红——红的生命力还在,但收住了攻击性,多数人读作\"温柔、亲和、不设防\"。而这颗是奶粉而非亮粉:奶粉≠少女糖粉,它读作\"成熟的柔软\",软,但不幼。","benefit":"它不会让谁更被爱——是把\"对自己也客气一点\"这件事,摆在你低头就看得见的地方。给那种对谁都软、唯独对自己最狠的人:留个落点,提醒你也在被照顾的名单里。","element":"补火(盘偏冷/缺暖意、待人待己太硬的人)。火主温与亲和,这颗补的是\"软\"的那一路火,不是冲劲那一路。"},{"id":"jx-028","cn":"西柚粉粉晶5","en":"Rose Quartz","el":"fire","color":"pink","wish":["confidence","energy","grounding","protection"],"teaser":"它不让你更被爱——是把\"对自己好一点\"这件事摆在你低头就看得见的地方","material":"不是亮闪的糖果粉——是带点灰的西柚肉色,粉里压着一层暖,温吞、半透、不抢眼。明度偏高(浅)、彩度低,所以它是一串里那颗\"垫底的暖\",负责把别的颜色托住,自己不出头。粉晶天生少有透亮的,这种带浊的浅粉才是真品种该有的样子,别指望玻璃般干净。","tradition":"传统说法(非科学):粉晶在 lore 里管\"爱、自我关怀、心轮\"——先对自己软,再对人软。库里给这颗挂的是 confidence/energy/grounding 这一路,而非常见的桃花线,所以这里取它\"暖而稳\"的一面:不是浓烈的爱,是日常那种\"待自己好一点\"的底色。","colorPsych":"粉是被读作温柔、亲和、放下防备的颜色(红的力量被冲淡成善意)。但这颗是压了灰的西柚粉,跟扎眼的少女粉是两回事——它不甜腻、不喊\"看我\",读起来更像\"成年人的温柔\":稳的,不闹的。","benefit":"它不让你更被爱——是把\"对自己好一点\"这件事摆在你低头就看得见的地方。给那种总把自己排最后、对别人比对自己耐心的人:一个不必解释的、软下来的落点。","element":"补火(盘偏冷、缺一点暖意与自我推动力);也常用来在一串冷色里加一格暖,平衡整体气温。"},{"id":"jx-029","cn":"马粉水晶三圈手串","en":"Madagascar Rose Quartz","el":"fire","color":"pink","wish":["confidence","energy","grounding","protection"],"teaser":"它不会让你被爱——是把\"先对自己软一点\"摆在你低头就看得见的地方","material":"奶感的浅粉，带点暖橘调（马达加斯加粉晶的底色）——不是糖果荧光粉，是被磨砂玻璃罩住的那种闷粉。彩度很低（库里偏淡的一颗），透光是朦的、半浑浊，不是水头清亮的玻璃体。三圈缠腕，珠子密、整体是一片柔粉云，所以它撑场靠\"量\"，单看一颗很安静。","tradition":"（传统说法，非科学）粉晶在西方水晶文化里是\"心轮石\"：系着爱、自我关怀、把对别人的温柔先匀一点给自己。中式里粉色属淡火，常被摆在感情/桃花的位置上。这些是 lore，不是验证过的功效。","colorPsych":"（Heller）粉是被读作温柔、亲和、无攻击性的颜色——它让人放下防备；而这种发灰的浅奶粉跟扎眼的荧光粉是两回事：荧光粉在喊，奶粉在\"靠近一点也没关系\"。低饱和让它显得不幼稚，是收着的暖。","benefit":"它不会让你被爱——是把\"先对自己软一点\"摆在你低头就看得见的地方。三圈缠在腕上是一整片安静的粉：给那种总把温柔先给别人、轮到自己就空着的人，一个提醒——你也在被照顾的名单里。","element":"补火（盘偏冷/缺暖意、缺自我滋养的那股劲）；粉=淡火，是温和补，不是红石那种猛火。"},{"id":"jx-030","cn":"西柚粉粉晶","en":"Rose Quartz","el":"fire","color":"pink","wish":["confidence","energy","grounding","protection"],"teaser":"它不会让你被爱——是把\"可以先对自己好一点\"这句话,摆在你低头就看得见的地方","material":"奶柚粉,带一点暖橘的肉粉调(不是糖果系的亮粉)。彩度很低、亮度偏高,所以它是雾蒙蒙、化在奶里的那种粉——半透到微透,光进去是散的,不抢。粉晶本就少有玻璃透,这颗走的是温润不是闪。一串里它是把温度调软的底色,不是焦点。","tradition":"(传统说法,非科学)粉晶在西方水晶 lore 里被叫\"爱之石\",系在自我关怀、柔软待己、心轮上;中式里也常跟桃花、感情缘分放一起。是讲\"对自己先松一口气\"的那一类石头,不是壮胆的。","colorPsych":"(Heller/通用色彩心理)粉是被读作温柔、亲近、放下防备的颜色;但奶柚粉跟扎眼的荧光粉是两回事——它低饱和、带暖橘,读起来不是\"少女撒娇\",而是\"成熟的温柔\",一种已经把刺收好了的软。","benefit":"它不会让你被爱——是把\"可以先对自己好一点\"这句话,摆在你低头就看得见的地方。给那种总把自己排最后、对别人软对自己硬的人:一个允许自己松一下的落点。","element":"补火(盘偏冷/缺暖意、缺自我接纳的温度),但它是火里最柔的一档——给温度,不给火气。"},{"id":"jx-031","cn":"紫马粉水晶","en":"Madagascar Rose Quartz","el":"fire","color":"pink","wish":["confidence","energy","grounding","intuition","love","protection"],"teaser":"它不会让人爱你——是给\"先对自己好一点\"这件事一个看得见的落点","material":"蒙眼一摸像普通粉晶,睁眼才看出区别:不是甜腻的奶粉色,是压了灰的旧玫瑰粉——彩度只有 21,等于一开始就被调暗了一格。半透,光进去是糊的、不是水亮,带一点暖褐底子(马达加斯加产的粉晶比巴西的淡粉更沉)。它是那种\"远看以为是裸色、近看才看出是粉\"的低调粉,不抢戏。","tradition":"(传统说法,非科学)粉晶在 lore 里就是\"心轮石\":管的是爱、自我关怀、把心打开。本系统按颜色把它归火(粉=淡火)。这颗连带挂了 grounding/protection 的标签——可理解为\"软,但不是没骨头的软\";传统上求桃花、修复感情常点它。","colorPsych":"(Heller)粉色是被多数人读作温柔、亲和、无攻击性的颜色;但压了灰的旧玫瑰粉跟亮粉、芭比粉是两回事——亮粉读作天真、讨好,这颗读作\"成熟的温柔\",有照顾人的劲,却不软到没分量。","benefit":"它不会让人爱你——是给\"先对自己好一点\"这件事一个看得见的落点。给那种总把别人放前面、轮到自己就说\"我没事\"的人:把这股软摆在手腕上,提醒你温柔也包括对自己温柔。","element":"补火(盘偏冷/缺心轮暖意、人际偏硬时点它),是淡火不是烈火——添一点暖,不烧。"},{"id":"jx-032","cn":"粉胶花水晶","en":"Flower Quartz","el":"fire","color":"pink","wish":["confidence","energy","grounding","love","protection"],"teaser":"它不会让你被爱——是把\"对自己别那么狠\"这件事,摆在你低头就看得见的地方","material":"不是透亮的水晶,是带一层奶雾的暖粉——偏桃色、偏陶土的那种粉,不是冷冷的少女粉。胶感、半透到不透,光进去是糊开的,内部那些云絮状的\"花\"就是它得名的地方。彩度低(lch 彩度才 30),所以它是安静的一颗,不抢戏。","tradition":"(传统说法,非科学)粉色水晶在 lore 里归\"心\"这一类:爱、自我关怀、心轮。\"花水晶\"这个具体品种古籍里没定说法,保守讲就借粉晶大类——温柔、和解、对自己软一点。别当成精确功效。","colorPsych":"(Heller)暖粉是被读作温柔、亲和、放下防备的颜色——它不像大红那样喊,而是\"靠近我没关系\"的信号。这颗又压了灰、罩了雾,所以是更克制的温柔:不是甜腻的粉,是已经长大了的那种软。","benefit":"它不会让你被爱——是把\"对自己别那么狠\"这件事,摆在你低头就看得见的地方。给那种对别人都很好、唯独对自己刻薄的人:一个允许你松一口气的落点。","element":"补火(盘偏冷、缺暖意/缺亲和力时);粉色火在五行里走的是温的那一路,不是燥的那一路。"},{"id":"jx-033","cn":"马达加斯加粉晶","en":"Rose Quartz","el":"fire","color":"pink","wish":["confidence","energy","grounding","intuition","love","protection"],"teaser":"它不让你更被爱——是把\"对自己也温柔一点\"摆在你手腕上看得见的地方","material":"奶雾粉,不是糖果粉——明度高(L74)、彩度极低,是那种被磨砂过、往里收的淡粉,常带一丝丝白棉絮或冰裂感。马达加斯加料偏柔,不通透也不冰亮,抛光后是温吞的哑光润,而非玻璃光;到手就是这股\"被冲淡过\"的暖,别指望艳。","tradition":"粉晶在传统说法里(lore,非科学)管\"心轮、爱与自我关怀\";中式常拿它系桃花、缘分。本系统按颜色归火——粉=淡火,是温的那一档,不烈。强调:以上是民俗象征,不是疗效。","colorPsych":"粉(Heller)读作温柔、亲和、被照顾的颜色,是攻击性最低的那一端;而这颗的奶雾淡粉≠扎眼的荧光粉——低饱和让它从\"少女糖\"变成\"成年人的软\",读起来是体贴,不是甜腻。","benefit":"它不让你更被爱——是把\"对自己也温柔一点\"摆在你手腕上看得见的地方。给那种对别人很软、对自己很狠的人:一个不必先够好才配被善待的落点。","element":"补火(盘偏冷/缺暖意、缺亲和柔劲),是温火一档,不上火。"},{"id":"jx-034","cn":"马粉","en":"Madagascar Rose Quartz","el":"fire","color":"pink","wish":["confidence","energy","grounding","protection"],"teaser":"它不让你更被爱——是把\"对自己好一点\"这件事摆在你低头就看得见的地方","material":"不透或半透的奶粉色,带一点灰调——不是糖果那种亮粉,是被磨柔了的旧玫瑰色(lch 明度高、彩度低,L73/C17)。比普通粉晶的奶白多一点暖肉粉,光打上去是雾蒙蒙地铺开,不通透。马达加斯加产的粉晶通常比泛白的那种粉色更实在一点,但仍是温吞的柔粉,不会扎眼。","tradition":"(传统说法,非科学)粉晶在 lore 里管\"爱、自我关怀、心轮\"——传统上系在对自己温柔、修复关系、桃花/感情这条线上;本系统按颜色把这颗淡粉归到火(淡火、心口的那点热),不是石英家族的金。","colorPsych":"(Heller/通用)粉是被调淡的红——红的\"生命力/激情\"被柔化成\"温柔、被照顾\"。但这颗是带灰的雾粉,跟甜腻的少女粉是两回事:它读作\"已经长大的温柔\",不软不嗲,是放松下来的暖。","benefit":"它不让你更被爱——是把\"对自己好一点\"这件事摆在你低头就看得见的地方。给那种总顾着别人、轮到自己就省略掉的人:一个允许你松一口气的落点。","element":"补火(盘偏冷、心口缺一点暖、自我关怀这股劲不足);淡火,补的是柔的那一面,不是冲劲。"},{"id":"jx-035","cn":"A级马粉","en":"Madagascar Rose Quartz","el":"fire","color":"pink","wish":["confidence","energy","grounding","protection"],"teaser":"它不会让你更被爱——是把\"对自己好一点\"这件事摆在你低头就看得见的地方","material":"藕粉调的淡粉,半透到微浊——不是糖果那种亮粉,是磨砂玻璃里透出来的旧玫瑰色。马达加斯加产的粉水晶大多带这种\"奶雾感\",抛光也只到温润不到镜面。库里彩度偏低的一颗(L*73 很亮、彩度不高),所以它在串里是退后、垫底色的角色,不抢戏。","tradition":"传统说法(非科学):粉水晶在西方与中式 lore 里都被归到\"心、爱、自我关怀\"那一类,管的是对自己和身边人的柔软;本系统按颜色把它归火(粉=淡火，心轮能量)。注意石英家族也有按金论的说法,这里是色彩优先的口径,不是定论。","colorPsych":"色彩心理(Heller/通用):粉是被读作温柔、亲和、无攻击性的颜色——比红退了一格火气。但奶雾淡粉≠少女糖果粉,前者读作\"放松下来的温柔\",后者读作\"刻意的甜\"。它整颗的点就在那层雾:亲近,但不腻。","benefit":"它不会让你更被爱——是把\"对自己好一点\"这件事摆在你低头就看得见的地方。给那种总把别人放前头、轮到自己就省略的人:一个提醒落点,先把自己也算进去。","element":"补火(盘偏冷/缺一点暖意与亲和)。粉=淡火,温的不是烈的,适合需要柔性暖意、不要刚猛行动力的盘。"},{"id":"jx-036","cn":"星光粉晶","en":"Rose Quartz","el":"fire","color":"pink","wish":["confidence","energy","grounding","protection"],"teaser":"它不会让你被爱——是给\"先对自己软一点\"这件事一个看得见的落点","material":"很浅的奶粉色,带一点雾感的半透——不是糖果粉,是被牛奶冲淡过的那种暖粉。彩度低(lch彩度仅12),所以它在串里是\"柔的、退后一格\"的角色;星光粉是带星彩的品种,转向光时面上会浮一道极淡的丝光,不抢戏,凑近才看得见。","tradition":"传统说法(非科学):粉晶在中式与西方lore里都被归为\"心轮石\",管的是爱、自我关怀、把心软下来这一类;那道星光被附会成\"温柔的指引\"。这是流传的象征,不是验证过的功效。","colorPsych":"柔粉是Heller笔下\"温柔、亲和、无攻击性\"的颜色,被读作善意与放松;而这颗是去掉了甜腻的低饱和粉——浅奶粉≠少女糖果粉,它读起来是\"对自己温和\",不是撒娇。","benefit":"它不会让你被爱——是给\"先对自己软一点\"这件事一个看得见的落点。给那种总在照顾别人、轮到自己就硬撑的人:把这股温柔摆在手腕上,提醒你也值得被这样对待。","element":"补火(盘偏冷/缺暖意、缺自我滋养时点一颗),但它是火里最柔的一档,暖而不烈。"},{"id":"jx-037","cn":"黑发晶水晶手串","en":"Black Rutilated Quartz","el":"water","color":"black","wish":["energy","grounding","protection"],"teaser":"它不让你变强——是把\"里头那股没声张的劲\"做成你看得见的一颗","material":"黑发晶 = 透到半透的水晶里,锁着一丛丛深色细针(金红石/电气石那类矿物),像冻在玻璃里的发丝。注意:它不是整颗墨黑——底子是带暖调的浅灰水晶,色值偏中性(L59、彩度近乎为零),那点\"黑\"是里头的针,不是表面的黑。预览里这颗读作\"灰底里藏着深线\",不是亮黑也不是纯黑,别当黑曜石那种实心墨色看。","tradition":"(传统说法,非科学)发晶在华人坊间的 lore 一向系在\"那丛针上\"——把发丝当成往里灌的劲,所以被说成给人添冲劲、扛得住事;深色针的那一支,传统上更偏\"压得住、护得稳、不被外头乱拽\"。这是民俗象征,不是石头真能挡什么。","colorPsych":"(Heller/通用色彩心理)它走的不是某个鲜艳色相,是一颗低彩度的中性灰——灰在色彩心理里读作\"不抢、可托底、成年人的克制\"。妙在灰底里那几道深针:中性背景上一点深线,人眼会盯,反而比一整颗黑更有\"内里有东西\"的分量。","benefit":"它不让你变强——是把\"里头那股没声张的劲\"做成你看得见的一颗。给那种不靠嗓门、靠扛得住事立住的人:别人看是低调一颗灰珠,只有你知道里头那丛针。把它摆在低头就看见的地方,提醒自己稳着来、不必证明给谁看。","element":"补水(内部用):el=water,适合盘偏火燥、需要往下沉一格、立住界线的人;中性灰底也让它在一串里好当\"安静的承托色\",不跟人抢。"},{"id":"jx-038","cn":"黑发晶水晶手串","en":"Black Rutilated Quartz","el":"water","color":"black","wish":["energy","grounding","protection","wealth"],"teaser":"它不会替你挡掉什么——是把\"我有我的边界\"这句话，做成你低头就看得见的一颗","material":"透明水晶里冻着一丛黑发丝——那是天然的针状内含物（黑碧玺/黑金红石那一类），不是裂、不是脏。整颗读作近黑的暖灰：底子是清的，密集黑针让它看上去深、沉、几乎不透光。每颗的针都长得不一样，所以这串没有两颗完全同款；越靠近看越像里头封了一团静止的线。黑得克制，不是钢琴漆那种贼亮的黑。","tradition":"（传统说法，非科学）发晶在华人水晶文化里被当作\"带力气的石头\"——那些贯穿的针被想象成一股穿透、立得住的劲；黑发晶尤其被归到辟邪、挡煞、守财这一类，传统上系在\"护身\"\"稳住底盘\"上。水晶本体则一向被说成放大与清晰。这些是流传的象征，不是功效。","colorPsych":"（Heller）黑是色彩心理里最讲\"界限\"与\"庄重\"的颜色——读作收口、有分量、不让人随便靠近。但这颗的黑里冻着发丝，不是死黑：它读作\"有内容的黑\"，沉得住，又不冷场。","benefit":"它不会替你挡掉什么——是把\"我有我的边界\"这句话，做成你低头就看得见的一颗。给那种太容易被别人推着走、想给自己留一道线的人：戴着它，不必跟谁解释，那道线就在那儿。","element":"补水（盘缺水/需收敛、立界、沉下来）。黑色归水，这颗的\"沉\"正是水的往下、往里。"},{"id":"jx-039","cn":"黑骨干水晶","en":"Skeletal Quartz","el":"water","color":"black","wish":["energy","grounding","intuition","protection"],"teaser":"它不让你变稳——是把\"先扎住根再说\"那股劲,摆在你低头就看得见的地方","material":"深烟茶色的水晶,不是亮黑——LCH 明度才 48、彩度只有 13,所以它是闷沉的暗琥珀棕,偏哑光。骨干水晶表面是层层凹进去的阶梯状、像被啃过的骨架结构,内里常有水雾、裂隙和影子,不是干净通透那种。这是它天然的\"长歪了又长回来\"的样子,别指望镜面玻璃感——深烟茶≠墨黑亮珠。一串里点一两颗就够沉,它本身就是来压秤的。","tradition":"(传统说法,非科学)水晶大类的老说法是\"净化、放大、把杂的理清\";骨干水晶因为那身坑坑洼洼、像老骨头的结构,在收藏圈被当成\"经历过、扛过来\"的石头,系在扎根、护着、把心收回身体里。这些是 lore,不是功效。","colorPsych":"(Heller)黑/深褐是读作\"庄重、界限、收住\"的颜色——人会本能把它读成\"这里到此为止\"。但它不是冷硬的纯黑,带烟茶的暖,所以那道界限读起来更像\"沉住气\",不是拒人千里。","benefit":"它不让你变稳——是把\"先扎住根再说\"那股劲,摆在你低头就看得见的地方。给那种心容易飘、想先把自己收回身体里的人:一个落点,让你慢一格、站住了再动。","element":"补水(盘火燥/浮、需要往下沉、立界、把心收住)。"},{"id":"jx-040","cn":"天然满色南红","en":"Red Agate","el":"fire","color":"red","wish":["confidence","energy","grounding","protection"],"teaser":"它不会让你变勇敢——它是把\"稳得住的那点底气\"摆在你低头就看得见的地方","material":"满色柿子红,带玛瑙特有的蜡感半透——明度压得低(L≈39),所以红得沉,不是亮面的鲜红;彩度只算中等(C≈59),光照进去是闷在里头的暖,转一下能看到那层蜡质的油光。\"满色\"指通体一色、少白筋杂质,但天然南红仍会有细密的纹路与色深浅,不是均匀染色的塑料红。一颗就压得住,串多了会重。","tradition":"(传统说法/lore,非科学)玛瑙家族在传统里管\"稳住、护着、扎根\";红色在中式语境里对应\"动起来、有胆气\"。南红作为玛瑙的一种,民间归为辟邪聚气、添胆气的暖石。这是流传的象征,不是经过验证的功效。","colorPsych":"(Heller/通用色彩心理)红是身体不经过脑子就读成\"靠近、上前\"的颜色(红=生命力/激情)。但深蜡红跟扎眼的正红是两回事——它不喊,读起来更像\"已经拿定了的那股劲\",沉、暖、有分量。","benefit":"它不会让你变勇敢——它是把\"稳得住的那点底气\"摆在你低头就看得见的地方。给那种想站住、又不想张牙舞爪的人:一颗沉色的红,在手腕上替你占住位置。","element":"补火(适合盘偏冷、缺行动力/缺一股往前的劲);同时玛瑙的\"稳\"也带一点土的扎根感,不至于只热不沉。"},{"id":"jx-041","cn":"蔷薇石手串","en":"Rhodonite","el":"fire","color":"red","wish":["confidence","energy","grounding","intuition","love","protection","self_love"],"teaser":"它不会让你更会爱人——是把\"对自己也温柔一点\"这件事,摆在你低头就看得见的地方","material":"蔷薇石(玫瑰石/Rhodonite)是一种带玫瑰红的锰硅酸盐——这颗 lch 落在中明度、中高彩度的\"暗蔷薇红\",不是甜腻的粉,也不是扎眼的大红,是被压暗了一格的玫红。它最认得出的标记是石头里常见的黑色锰氧化脉络(像红肉上的黑筋),抛光后是温润的蜡感半亚光,不通透。预览里看到的\"匀红\"到手会带筋路,这是真鉴别特征,不是瑕疵。","tradition":"(传统说法/lore,非科学)蔷薇石在西方水晶 lore 里被归为\"心石\":红主胆识与行动,粉玫主关怀与自我和解,所以它常被讲成\"既能往前冲、又能照顾到自己\"的那一类;那道黑脉,坊间说法把它读作\"在情绪里扎住根、不被卷走\"。中式归到火行(参 crystal-product-kb 火行/爱与自我关怀一脉)。这些是传统象征,不是功效。","colorPsych":"(Heller/通用色彩心理)红是身体不经过脑就读成\"靠近、生命力、激情\"的颜色;但被压暗、掺了玫粉的蔷薇红跟正红是两回事——正红往外喊,这颗往内暖,读作\"放软下来的热情\",一种顾得上别人也顾得上自己的暖。黑脉的存在又给它一点收敛和分量,不至于甜得发轻。","benefit":"它不会让你更会爱人——是把\"对自己也温柔一点\"这件事,摆在你低头就看得见的地方。给那种总把别人放前头、轮到自己就草草了事的人:一个提醒你也值得被你自己照顾的落点。那道黑脉同时像句小声的\"站住\":暖,但不软到没分寸。","element":"补火(盘偏冷/缺行动力、或情感面收得太紧需要回点暖)。火行里偏\"爱与自我关怀\"一支,而非冲刺型的烈火。"},{"id":"jx-042","cn":"樱花雨水晶手串1","en":"樱花雨水晶手串1","el":"fire","color":"red","wish":["confidence","energy","grounding","protection"],"teaser":"它不让你变温柔——是把\"对自己也能软一点\"这件事,摆在你低头就看得见的地方","material":"樱花雨水晶——透/乳白的水晶底里浮着一片片粉红到淡红的内含物,像隔着玻璃看一场散落的花雨。整颗是带灰的脏粉(LCH 明度中等、彩度低 C31、偏红 H11),不是糖果粉也不是大红,光照进去是闷柔的暖。它最真的样子就是\"不均匀\":有的位置花瓣密、有的位置近乎清水,一颗一颗都不一样,别指望串起来颜色齐整。","tradition":"(传统说法,非科学)库里把粉色水晶大类系在\"爱、自我关怀、心轮\"上;水晶底则取\"放大、清晰\"。合起来在 lore 里常被讲成:照看自己那块、把柔软留给自己。具体\"樱花雨\"这种含粉内含物的品种没有独立古典出处,沿用粉晶大类的传统象征,说到这里为止。","colorPsych":"(Heller)粉是被读作温柔、亲和、无攻击性的颜色;但带灰的脏粉跟亮糖果粉是两回事——它不撒娇,读作\"收着的温柔\"。底子那点乳白又添了留白感,整颗安静不抢。","benefit":"它不让你变温柔——是把\"对自己也能软一点\"这件事,摆在你低头就看得见的地方。给那种对别人耐心、轮到自己就刻薄的人:一颗会自己散花的珠子,提醒你那份照看也分你一份。","element":"补火(盘偏冷/缺一点暖与亲近力);火性温和的一颗,不猛,适合需要回暖又不想被点着的盘。"},{"id":"jx-043","cn":"草莓晶水晶","en":"Strawberry Quartz","el":"fire","color":"red","wish":["confidence","energy","grounding","love","protection"],"teaser":"它不让你更被爱——是把\"对自己也可以温柔\"这件事,摆在你低头就看得见的地方","material":"不是粉晶那种甜白粉,是带土的暖红——lch 明度中等(L54)、彩度不高(C34),所以它是\"沉过的草莓酱色\",不刺眼。石英底子,半透,光进去是柔的;真正的草莓晶里常有发丝状/片状内含物,转一下能看见里面浮着的细点,不是干净通透的玻璃感。库里它属于\"低调暖色\"那一档,适合垫底铺面,不抢戏。","tradition":"(传统说法,非科学)石英家族在 lore 里管\"放大、把能量带清楚\";粉红到红这一支被系在心轮——传统象征\"爱、自我关怀、把心打开\"。草莓晶不是古籍里的老名号(库里没有它的专条),按粉水晶/水晶大类的公认说法走:它代表\"对自己温柔一点\",而非招桃花的法术。","colorPsych":"(Heller)红是身体直接读成\"生命力/暖\"的颜色;但这颗是掺了灰土的低饱和红——红的\"热\"被压成了\"温\"。Heller 里偏粉的红常被读作温柔、亲近、不设防;所以它不是热烈的红,是\"可以靠近的那种暖\",一个点:让人想伸手碰。","benefit":"它不让你更被爱——是把\"对自己也可以温柔\"这件事,摆在你低头就看得见的地方。给那种总把劲使在别人身上、轮到自己就硬扛的人:留一颗暖色在手腕上,提醒你也值得被这样待。","element":"补火(盘偏冷、暖意/亲和力不足);是温补的那种火,不是南红那种烈火,适合需要\"软暖\"而非\"猛攻\"的盘。"},{"id":"jx-044","cn":"红胶花水晶","en":"Flower Quartz","el":"fire","color":"red","wish":["confidence","energy","grounding","protection"],"teaser":"它不替你壮胆——是把\"想清楚再上\"的那种稳劲,做成你低头就看得见的一点暗红","material":"砖红偏暗的一颗,红里压着土褐(lch 明度才41、彩度40)——不是宝石那种亮红,是闷在石英底子里的旧红。\"胶花\"指的是水晶里那层雾蒙蒙的絮状包裹,所以它半透不透,像隔了一层胶看进去;颜色不匀、带云,这是它本来的样子,不是瑕疵。","tradition":"(传统说法,非科学)它是石英家族的一员,石英在 lore 里管\"净化、放大、把人想清楚\";红色这一端在中式五行里系着\"活力、胆气、扎根的力\"(同红碧玉那一路)。具体到\"红胶花水晶\"这个品种,古籍没有单独条目,以上是按石英大类 + 红色火属性的公认说法,不是它独有的功效。","colorPsych":"(Heller)红是身体不过脑就读成\"动起来\"的颜色(红=生命力/激情);但这颗是压暗的砖红,不是扎眼大红——读作\"沉住气的那股劲\",有热度却不喧哗,像烧到后半程的炭。","benefit":"它不替你壮胆——是把\"想清楚再上\"的那种稳劲,做成你低头就看得见的一点暗红。给那种不靠嗓门、靠站得住来撑场的人:热度在,但不必嚷出来。","element":"补火(盘偏冷、缺行动力/根基不稳时垫一把);石英底子也带一点\"放大、理清\"的中性收口。"},{"id":"jx-045","cn":"星光草莓","en":"星光草莓","el":"fire","color":"red","wish":["confidence","energy","grounding","love","protection"],"teaser":"它不会让谁爱上你——是把\"先对自己软一点\"这件事,摆在你低头就看得见的地方","material":"不是糖果草莓红。它偏暗、彩度低(lch L41/C20),是那种晒干了的、压着土气的暗莓红;名字里的\"星光\"指内含物在光下会蹦出极细的小点子反光,不是整颗发亮——靠近看是磨砂质感里嵌着零星亮渣,远看就是一颗沉稳的浊红。别指望它鲜艳。","tradition":"(传统说法,非科学)草莓晶在水晶 lore 里归在\"爱与心轮\"那一支——粉水晶的近亲,主打温柔的爱、自我善待、关系里的暖意;那些红色小点子被说成是\"把爱意点进石头里\"。红又添了一层胆气与活力。库里没单列这个品种,这是按草莓晶/粉水晶大类的公认说法,当 lore 看。","colorPsych":"(Heller)红是身体不过脑就读成\"靠近、心动\"的颜色(红=生命力/爱意/激情);但这颗是闷下去的暗莓红——晒干的莓红≠扎眼大红,它读起来不是冲上来的热,而是已经焐熟、放低了声音的那种暖。","benefit":"它不会让谁爱上你——是把\"先对自己软一点\"这件事,摆在你低头就看得见的地方。给那种总把别人放前头、轮到自己就将就的人:一颗提醒你也值得被温柔对待的暗红。","element":"补火(盘偏冷/缺暖、缺亲近的行动力);走的是温火不是烈火,适合需要被焐一格、而非被点燃的盘。"},{"id":"jx-046","cn":"红虎眼","en":"Red Tiger Eye","el":"fire","color":"red","wish":["confidence","energy","grounding","protection"],"teaser":"它不让你更猛——是把\"看清了再动\"的那股稳劲,摆在你低头就看得见的地方","material":"砖红偏褐的暗红——不是鲜红,L 才 24,是闷在底下的氧化铁锈红。抛光后顺着纹理有一道丝绢般会游走的\"猫眼\"光带（虎眼石的标志）。诚实说:市面红虎眼绝大多数是棕虎眼经加热/处理转红的,所以这股红偏稳偏哑,不会扎眼;质地不透,是实色珠。","tradition":"(传统说法,非科学)虎眼石在 lore 里管\"洞察、意志、行动力\",被当作看清局面、稳住心神的护石;红色这一支在传统里再叠一层\"生命力、胆气、扎根\"。合起来是\"看得清、又敢动\"的暖石。","colorPsych":"(Heller)红是身体不过脑就读成\"上、动起来\"的颜色(红=生命力/激情);但这颗是暗砖红≠扎眼大红——它不喊,读作\"已经压住了的那股劲\",带一点褐让它更像土里长出来的稳。","benefit":"它不让你更猛——是把\"看清了再动\"的那股稳劲,摆在你低头就看得见的地方。给那种容易冲动、又怕自己优柔的人:那道游走的光带提醒你,定住一秒,再迈步。","element":"补火(盘偏冷/缺行动力、缺主心骨时点一两颗);暗褐底又稍带土性,落地不飘。"},{"id":"jx-047","cn":"高透黄水晶","en":"Citrine","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不让你变有钱、也不替你招财——是把\"那股往前、往亮处去的暖劲\"摆在你低头就看得见的地方","material":"高透的浅金黄,通透不浑——光能穿过去,亮度高(L≈76)但彩度压得低(C≈30),所以是清浅的暖黄,不是橙也不是那种浓得发腻的姜黄。库里偏\"轻\"的一颗:透、淡、亮,放一串里像漏进来的光斑,不抢戏。别指望它浓——它的好处恰恰是干净通透。","tradition":"传统说法(非科学):黄水晶在中式水晶文化里常跟\"财、聚财\"挂钩,黄=土,管\"落地、稳得住\";西方 lore 里也把它系在自信、丰盛、太阳能量上。这些都是传统象征,不是功效。","colorPsych":"挂 Heller:黄是最亮、最往前跳的暖色,通常读作阳光、乐观、被照亮的那种愉快。但清浅的高透黄跟扎眼的柠檬黄是两回事——它不刺眼,读作\"暖,但收着的暖\",像晨光不是正午。","benefit":"它不让你变有钱、也不替你招财——是把\"那股往前、往亮处去的暖劲\"摆在你低头就看得见的地方。给那种心里其实想往上走、又老把自己说轻了的人:一点不喧哗的提醒,你可以亮一点。","element":"补土(盘虚浮、缺落地与定力时用);黄=土,给盘添一笔\"稳住、扎根\"的暖。"},{"id":"jx-048","cn":"橘子胶花","en":"Flower Quartz","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不替你把钱挣来——是把\"稳稳攒、踏实过\"这股劲摆在你看得见的地方","material":"焦糖橘的暖色,L59/彩度33——不是橙汁那种鲜亮橙,是收过一道、像凝住的果胶/麦芽糖的闷橘。半透不透,光进去是糊在里面的暖,表面带一点蜡感,温吞的一颗,不抢戏。","tradition":"(传统说法,非科学)按颜色入五行,橘黄归土;中式水晶文化里黄/金这一类暖石长年系在\"财、落地、把日子过踏实\"上——管的是\"稳稳攒住\"而非\"暴富\"。具体品种特性保守说,这层是 lore 不是产地认证。","colorPsych":"(Heller)黄/暖橘是被读作温度的颜色——亲切、有活气、像晒过太阳的那种暖(黄=暖能量)。但这颗是收过的焦糖橘,不是高饱和的\"招呼人\"橘:暖,却暖得安静,读起来是\"过日子的暖\"不是\"派对的亮\"。","benefit":"它不替你把钱挣来——是把\"稳稳攒、踏实过\"这股劲摆在你看得见的地方。给那种不求一夜翻身、只想一天天把根扎牢的人:一个让你想起\"慢慢来也算数\"的暖色落点。","element":"补土(盘虚浮/缺落地、需把心定住、攒得住)。"},{"id":"jx-049","cn":"黄金胶花水晶","en":"Flower Quartz","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不让你有钱——是把\"我站得住、配得上\"那点暖摆在你看得见的地方","material":"暖琥珀金的水晶,体里像凝住了一团团絮状的\"花\"——所谓胶花,就是石英里裹着的细小包裹物,聚成云絮、棉团的样子。中等明度、彩度不高(lch 64/46),不是金灿灿的亮黄,是闷着光的暖蜜色;半透到微浊,你能看见里头那点雾,不是玻璃珠那种空透。一颗一颗\"花\"长得都不一样,所以同一串里它最像\"有内容\"的那几颗。","tradition":"(传统说法,非科学)石英家族在 lore 里管\"放大、净化、把意图说清楚\";暖黄/金这一支在中式水晶文化里向来跟\"财、落地、稳住自己\"挂钩——和黄水晶同一条暖土脉络。那团内里的\"花\"被一些说法读作\"聚\"——把散的东西收拢。这些都是象征,不是石头真会做什么。","colorPsych":"(Heller)黄是离日光最近的颜色,读作暖、近、不设防;但这颗是压低了的蜜金,不是高饱和的扎眼亮黄——它读作\"晒过的暖\",踏实那一类,不是张扬那一类。里头化不开的絮白又给暖加了一层\"沉\",整颗有种被时间焐熟的安稳感。","benefit":"它不让你有钱——是把\"我站得住、配得上\"那点暖摆在你看得见的地方。给那种闷头干、却老忘了肯定自己的人:那团暖花就在腕上,提醒你已经攒下的东西是真的。","element":"补土(盘虚浮、缺根、聚不住),也给偏冷的盘添一格暖。"},{"id":"jx-050","cn":"超透体黄塔晶","en":"超透体黄塔晶","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不会替你把钱赚来——是把\"那束往一处使的劲\"做成你看得见的样子","material":"超透的浅金底色,里头能看见一根根细金针(钛/金红石包体)悬在水里——所谓\"塔晶\"就是那束针。明度中上、彩度不低(lch 67/45/79),是清亮的暖金,不是发雾的土黄;光照进去会顺着针走、有一点丝缎感。比黄水晶冷静、比钢板钛晶细,属于\"看得见结构\"的那种透。注意:塔晶的针多寡天然不均,这颗以\"透+疏针\"为底,不是满天星的密钛晶。","tradition":"传统说法(非科学):金发/塔晶在中式水晶文化里被归到\"财与气场\"一类,那束金针被讲成\"贯通的财气、聚拢的能量\";黄色系石头(同黄水晶一脉)的老说法是\"招财、自信、落地\"。这些是 lore,不是功效。","colorPsych":"挂 Heller:黄是最亮、最先被眼睛抓到的暖色,通用读作乐观与暖能量;但清亮金黄≠土气暗黄——它读作\"被打理过的、有底气的亮\",像金子那种沉得住的暖,而不是塑料黄的吵。那束金针又给这份亮加了\"有方向\"的感觉。","benefit":"它不会替你把钱赚来——是把\"那束往一处使的劲\"做成你看得见的样子。给那种心里有目标、就缺一个每天提醒自己别散的人:低头看一眼那几根金针,知道自己在往哪走。","element":"补土(盘虚浮、缺落地/聚不住气时,用来压一压、定个中心);黄=土,暖而稳。"},{"id":"jx-051","cn":"钢板金发晶钛晶","en":"Golden Rutilated Quartz","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不会替你招来一笔钱——是把\"我在认真往一件事上使劲\"这股劲,做成你低头就看得见的一束金丝","material":"通透到微烟的水晶肉里,封着一束束金棕色的细针(钛晶/金红石),\"钢板\"指针密又顺、几乎排成一面——光打进去,是里头那些金线在反光,不是表面镀的亮黄。所以它不是一颗实色黄珠,而是\"透底+内有金丝\"的一颗;lab 偏暖、彩度中等,读作温琥珀金而非扎眼明黄。针多的地方深、针疏的地方透,每颗的丝路都不一样,这是天然内含物,不是瑕疵。","tradition":"(传统说法 lore,非科学)发晶/钛晶在华人传统里被当成\"金针引气\"的招财旺事业石,那束金丝被读作把财气、行动力\"聚拢成一股\";本系统库里没有这一具体品种,借同为土属性、同走暖金的虎眼石(洞察/意志/行动力)与黄水晶(财运/自信/落地)的公认说法定位——稳、聚、往事业上使劲。","colorPsych":"(Heller)金黄是被读作温暖、富足、价值的颜色,接近\"光\"本身;但这颗的金不是平涂的亮黄,而是从透底里渗出来的暖金丝——所以它不喊\"看我有钱\",更像\"沉得住的那种底气\",一种有重量的暖。","benefit":"它不会替你招来一笔钱——是把\"我在认真往一件事上使劲\"这股劲,做成你低头就看得见的一束金丝。给那种闷头干、不爱表态、但心里有个目标的人:每次瞄一眼,就替你把那个目标重新对准一次。","element":"补土(盘虚浮/缺落地、缺持续行动力时),暖金一路也能托一托偏冷的盘。"},{"id":"jx-052","cn":"天然黄虎眼6","en":"Yellow Tiger Eye","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不让你变果断——是把\"看清楚再动手\"的那股劲,摆在你低头就看得见的地方","material":"深琥珀棕,带一道丝绢般的横向光带——转一下,那条亮线会顺着珠子滑过去(虎眼石标志性的\"猫眼\"反光,行话叫 chatoyancy)。L 只有 38、彩度也压得低,所以它不是亮金,是闷在底子里的暗金棕。这串里最沉稳的一颗,靠那道游移的光出彩,不靠颜色亮。","tradition":"传统象征(传统说法,非科学):虎眼石在西方常被叫作\"勇者之石\",传统 lore 里系在\"洞察、意志、行动力\"上——既看得清又站得住。那道猫眼光本身被附会成\"看穿迷雾的眼睛\"。这些是流传的象征,不是经过验证的功效。","colorPsych":"色彩心理(Heller/通用):金棕落在黄与棕之间——黄是暖能量、是\"被照到\"的颜色,棕是大地、是踏实可靠。所以这颗读起来不是张扬的暖,是\"压住了的暖\":有热度,但稳,像晒过太阳的木头。","benefit":"它不让你变果断——是把\"看清楚再动手\"的那股劲,摆在你低头就看得见的地方。给那种容易想太多、迟迟下不了决心的人:那道滑过去的光提醒你,该往前一步了。","element":"补土(盘虚浮/缺定力、需要落地扎根)。色金棕也带一点金,偏向稳与收。"},{"id":"jx-053","cn":"高品黄萤石","en":"Fluorite","el":"earth","color":"yellow_gold","wish":["career","confidence","energy","grounding","protection","wealth"],"teaser":"它不让你突然清醒——是把\"该收一收、理一理\"这件事,摆在你低头就看得见的地方","material":"暖蜜黄到金棕,半透不通透——萤石本就软,光进去是漫开的雾感,不是水晶那种利落的透。这颗彩度中等、明暗居中(lch 66/55/81),所以是\"稳得住的黄\",不是亮骚的柠檬黄;表面常带细微的天然纹,看着像被阳光泡过的石头,而不是抛得发贼光的玻璃珠。","tradition":"(传统说法,非科学)萤石在 lore 里被叫\"学霸石/智慧石\",传统 associations 集中在\"理清乱思路、收住一团乱的注意力\";黄/金这一脉又被归到土的踏实与丰盛上。库里只考据了绿萤石(成长/疗愈/心灵整理),黄萤石属同一大类的保守延伸,精确产地与功效不编。","colorPsych":"(Heller)黄是离阳光最近的颜色,通用读作暖、明朗、被照到;但这颗是收着的蜜黄,不是高亮警示黄——读起来像午后的光,而不是正午的刺眼。暖蜜黄≠扎眼柠檬黄:前者让人放松靠近,后者让人本能躲。","benefit":"它不让你突然清醒——是把\"该收一收、理一理\"这件事,摆在你低头就看得见的地方。给那种脑子里同时开十个窗口、想找个落点把它们一个个关上的人:一点暖光,提醒你慢一格、拣一件先做。","element":"补土(盘虚浮、缺定盘星、想法多落地少)。黄/金属土,给飘的盘一个往下沉的锚。"},{"id":"jx-054","cn":"黄萤石手串","en":"Fluorite","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不让你变专注——是把\"把事理顺、坐下来做\"那股劲,摆在你低头就看得见的地方","material":"暖黄金调的萤石,带蜂蜜糖块那种半透——光打进去是柔的、糊一层的暖黄,不是水晶那种通透发亮。萤石本身偏软(摩氏才4),所以抛光面温润不锋利,边角看着圆钝;颜色中等浓度,不刺眼也不寡淡,属于一串里能当暖底色的那种,放两三颗不抢戏。","tradition":"(传统说法,非科学)萤石在民间被叫\"天才之石\",lore 里管它\"理清脑子、收拢散乱的注意力\";黄色这支按传统五行归土、偏向落地与务实。具体黄萤石的产地、特性说法不一,这里只取萤石大类公认的 lore,不作精确断言。","colorPsych":"(Heller)黄是离阳光最近的颜色,读作暖、醒神、往外发的那种轻快能量(黄=暖能量/乐观)。但这颗是糊一层的暖黄,不是柠檬那种亮黄——亮黄≠这种闷蜜黄,后者收着点,读起来更像\"晒着的下午\",不吵。","benefit":"它不让你变专注——是把\"把事理顺、坐下来做\"那股劲,摆在你低头就看得见的地方。给那种脑子总开太多窗、想收回来一件件做完的人:一个让注意力落地的暖色锚点。","element":"补土(盘偏虚浮/缺落地、需要务实收束的那类)。内部用:土主稳与收,这颗暖黄给散漫的盘添一点\"坐得住\"的分量。"},{"id":"jx-055","cn":"千层幽灵","en":"千层幽灵","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不会替你把钱挣来——是把\"一层一层垒、不急着一夜成\"的那股耐性，摆在你手腕上看得见的地方","material":"透明石英里裹着一层层云雾状的矿物包裹体，像往水里看进去能看到沉下去的薄云。色值偏暖浊褐(lch L52·彩度才22)——别被\"幽灵/金\"的名字骗了：到手是温吞的茶褐、土黄，不是亮金，半透不通透，每颗里那几层\"千层\"纹路深浅都不一样，所以同一串里它们各长各的样，不齐。","tradition":"(传统说法，非科学)幽灵水晶在华人圈被叫\"鬼佬财神\"，那一层层包裹体被附会成\"财富一层层累积\"，传统拿它系在聚财、事业稳扎稳打上；底子是石英家族，老说法里管\"放大、净化\"。这些都是 lore，不是矿物功效。","colorPsych":"(Heller)褐/土黄是大地色，被读作踏实、可靠、不浮——最不让人警惕的一类颜色。这颗彩度低、还浊，那种\"沉得住、不抢话\"的稳，正是它的一个点：不亮眼，但耐看、压得住场。","benefit":"它不会替你把钱挣来——是把\"一层一层垒、不急着一夜成\"的那股耐性，摆在你手腕上看得见的地方。给那种认死理、相信慢功夫的人：一个提醒自己别图快的落点。","element":"补土(盘缺稳定/根基浮、想落地扎根)。土生金，也间接帮金弱聚财的盘。"},{"id":"jx-056","cn":"珊瑚玉手串","en":"Coral Jade","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不会让你「落地」——是把那种「踏实下来」的感觉，做成一颗你低头就摸得到的暖石","material":"暖土褐到淡蜜的过渡色，半透到不透，蜡质哑光——不是金灿灿的亮黄，是被光焐过的旧黄。珊瑚玉本是远古珊瑚被玉化的化石，表面常带细密的花瓣纹/蜂窝纹，每颗的纹路都不一样。色不张扬(中明度、低彩度)，是那种放在串里压得住、不抢戏的暖底色。","tradition":"传统说法(lore，非科学)：珊瑚玉属玉的大类，玉在中式里管「温润、护佑、传承」；它又是珊瑚化石，民间把它看作「亿万年沉下来的东西」，象征扎根、稳住、不轻易动摇的根基。归土，主稳与守。","colorPsych":"暖棕黄(Heller：黄=暖能量，棕=踏实、可靠、贴近大地)。这颗黄被压暗、降了彩度——不是兴奋的鲜黄，读作「成熟、稳妥的暖」，像晒过太阳的旧木头，让人安心而不上头。","benefit":"它不会让你「落地」——是把那种「踏实下来」的感觉，做成一颗你低头就摸得到的暖石。给那种心一直悬着、想找个东西压住的人：一个看得见的「我站这儿了」的落点。","element":"补土(盘根基虚浮/缺定力、需稳住与守成)。"},{"id":"jx-057","cn":"柠檬晶水晶手串","en":"柠檬晶水晶手串","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不会给你带来钱——是把\"我配得上、我能站定\"这件事,放在你手腕上看得见的地方","material":"浅柠檬黄,通透但不张扬——LCH 亮度 82、彩度只有 29,所以它是\"淡\"的那种黄,像兑了水的阳光,不是深琥珀那种浓蜜色。多数市面\"黄水晶\"其实是浅淡的柠檬调,清透干净,放一串里是提亮的那颗,不抢戏。别指望它金灿灿,它是温吞的浅黄。","tradition":"(传统说法,非科学)中式水晶文化里黄水晶常跟\"财\"绑在一起,也被说成管\"自信、落地\";黄属土,土主稳、主守得住。注意:这是民俗 lore,不是它真能招财。","colorPsych":"(Heller)黄是最被读作\"暖、明亮、乐观\"的颜色,人会本能地往它那儿看;但浅柠檬黄跟扎眼的明黄是两回事——它读作\"被晒到的下午\",是松快、不是兴奋。","benefit":"它不会给你带来钱——是把\"我配得上、我能站定\"这件事,放在你手腕上看得见的地方。给那种想稳稳往前、又不想咬牙硬撑的人:一抹浅黄提醒你,松着也能落地。","element":"补土(盘子飘、缺定盘星/根基)。黄=土,主稳与守。"},{"id":"jx-058","cn":"橘色胶花水晶手串","en":"Flower Quartz","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不会给你好运——是把\"暖一点、松一点、把日子坐稳\"这种感觉,摆在你低头就看得见的地方","material":"浅杏橘到暖驼色,L偏亮、彩度低(lch 71/22/58)——是那种被奶感裹住的暖橘,不是熟透的橙。里头常有一团团雾白的\"花\":这就是\"胶花\"的来历,通透感是半透到偏浑,亮但不刺。看着柔、好搭,但要诚实说:这类胶花水晶是工艺感很重的料,花纹是观赏点不是天然名贵的标志,别当高料水晶看。","tradition":"(传统说法,非科学)按五行配色它归土:暖黄/橘在中式里一向系\"落地、根基、聚财\"那一类(lore,跟黄水晶同走\"财/务实/把事坐稳\"的象征)。胶花本身没有古籍背书,这里借的是黄橘色与土属性的公认联想,不是这颗珠子自带的功效。","colorPsych":"(Heller)橘=暖能量、亲和、不端着的快活——是黄的暖加红的劲、但都收着一格。这颗又压了彩度成奶橘,所以读起来不是张扬的活泼,而是\"晒过太阳的踏实暖\",让人想靠近、不设防。","benefit":"它不会给你好运——是把\"暖一点、松一点、把日子坐稳\"这种感觉,摆在你低头就看得见的地方。给那种总绷着、想给自己一点暖底色又不爱声张的人:一个让肩膀落下来的提醒。","element":"补土(盘偏飘/缺落地、根基不稳时用),内部走\"把事坐实、聚拢\"那一档。"},{"id":"jx-059","cn":"黄胶花水晶手串","en":"Flower Quartz","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不会给你带来钱——是把\"该挣的我配得上\"那股底气,摆在你低头就看得见的地方","material":"暖琥珀金的\"胶花\"水晶——胶,说的是它那种半透的果冻感:不是玻璃般通透,内里浮着一层化不开的云絮花纹。明度中等(L62)、彩度也压着(C35),所以是温吞的蜜糖金,不是亮黄宝石那种刺眼的金。一种被磨砂过、含在嘴里的暖光。","tradition":"(传统说法,非科学)它属黄色石英一族——中式水晶文化里,暖黄/金一向系在\"财、落地、安稳\"上,黄水晶这类是公认的\"招财、聚气\"暖石。胶花的云絮花纹另被看作\"藏得住\"的意象。具体到\"胶花水晶\"这个品种没有独立古籍 lore,以上是黄色石英大类的通行说法。","colorPsych":"(Heller)黄是最被读作\"暖、阳光、乐观\"的颜色,身体一眼就把它认成\"日光下\"。但这颗是被压住的蜜金,不是扎眼的柠檬黄——它读起来不是兴奋,是\"晒过太阳后那种踏实的暖\",安静地占着场子。","benefit":"它不会给你带来钱——是把\"该挣的我配得上\"那股底气,摆在你低头就看得见的地方。给那种闷头做事、却总不好意思要自己应得的人:一个安静的、属于你的暖色落点。","element":"补土(盘偏散/缺根基、需落地收拢)。暖金调内部归土,主\"稳住、聚气\"。"},{"id":"jx-060","cn":"黄胶花水晶","en":"Flower Quartz","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不让你变有钱、也不招财——是把\"踏实做事、慢慢攒\"的那股暖劲摆在你手腕上看得见的地方","material":"温吞的暖金黄,不是亮柠檬黄——lch 明度中等、彩度不高(37),所以它是\"被日头晒透的浅蜜色\",哑而不闷。\"胶花\"指里头那点絮状包裹体:石英里浮着丝/絮,不是干干净净的透明珠,而是带一点云翳的暖石。深蜜黄≠刺眼的亮黄:它在串里是垫底的暖,不抢戏。","tradition":"(传统说法,非科学)库里没有这具体品种的条目;按黄色=土的大类公认说法:黄色石英在中式水晶文化里常跟\"财、落地、踏实\"挂钩(同黄水晶一路),黄=土,管的是稳住、聚拢、把事做成。这是 lore,不是功效。","colorPsych":"(Heller)黄是最暖、最\"往外送\"的颜色,通用读作阳光/暖能量/乐观;但这颗是化开的浅蜜黄,不是高亢的招牌黄——它读作\"晒过太阳的安心\",暖而不吵,适合当一串里的体温。","benefit":"它不让你变有钱、也不招财——是把\"踏实做事、慢慢攒\"的那股暖劲摆在你手腕上看得见的地方。给那种不靠运气、信日积月累的人:一个提醒落地、别飘的暖色落点。","element":"补土(盘缺土/根基浮、需要落地踏实的人)。内部用:黄=土,垫稳重心那一类。"},{"id":"jx-061","cn":"天然水晶奶黄晶","en":"天然水晶奶黄晶","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不会让你赚到钱——是把\"暖、稳、踏实\"那种底色铺在你看得见的地方","material":"奶油一样的浅黄,半透里带一层奶雾——不是黄水晶那种透亮金黄,是更软、更哑的暖白偏黄。明度高、彩度低(库里偏淡的一颗),所以它在一串里是\"垫底的暖光\",不抢戏,适合做大面积铺色。","tradition":"传统说法(非科学):中式按颜色把黄归土,黄水晶/奶黄晶这一类常被系在\"财、自信、落地\"上;土也管\"稳、聚、守得住\"。奶黄比纯黄更偏\"温养\"那一头。","colorPsych":"色彩心理(Heller):黄是离阳光最近的颜色,读作暖、亮、有底气;但这颗是奶化过的浅黄——不是扎眼的明黄,读起来更像\"晒过的午后\",暖,但不吵。","benefit":"它不会让你赚到钱——是把\"暖、稳、踏实\"那种底色铺在你看得见的地方。给那种不想靠紧绷撑着、想松着也站得住的人:像一束不刺眼的暖光,搁在手腕上。","element":"补土(盘偏虚浮/缺落地、聚不住);也给过冷的盘加一格温吞的暖。"},{"id":"jx-062","cn":"黄虎眼","en":"Yellow Tiger Eye","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不让你变果断——是把\"看清了再迈那一步\"的稳劲,摆在你手腕上能瞥见的地方","material":"深金棕,带那条只有虎眼才有的\"猫眼\"丝光——一道亮带顺着珠面横着滑,转一下它就跟着走。明度不高(偏暗的金褐),所以不是亮黄、是熬过火的棕金;丝纹是天然层理抛出来的,不是镀的。一串里它是有\"纹路在动\"的那颗,不抢色,但耐看。","tradition":"(传统说法,非科学)虎眼在 lore 里管\"洞察、意志、行动力\"——老话说它像一只半睁的眼,替你盯着前路;土属性,落在\"稳住、扎根、看清了再动\"上。属土的暖金石,传统associations偏向把决心收住、不慌。","colorPsych":"(Heller)金棕是大地与收成的颜色,读作踏实、可靠、有分量;不是亮黄那种外放的暖,是压低了一档的暖——加上那道游移丝光,整颗像\"沉得住、但眼里有光\"。","benefit":"它不让你变果断——是把\"看清了再迈那一步\"的稳劲,摆在你手腕上能瞥见的地方。给那种事多、容易被晃花眼的人:让你慢半拍盯住目标,先站稳,再走。","element":"补土(盘偏飘/缺定力、需要扎根落地);暖金调,也给偏冷的盘添一点稳实的暖。"},{"id":"jx-063","cn":"黄水晶","en":"Citrine","el":"earth","color":"yellow_gold","wish":["career","energy","grounding","wealth"],"teaser":"它不让你赚到钱——是把\"该往前一步\"的暖意摆在你看得见的地方","material":"暖蜜黄,透到底但不刺眼——L72 的亮配 C36 的彩度,是化在水里的那种淡金,不是柠檬黄或荧光黄。市面黄水晶大多是紫水晶加热转黄(行业常态,不算骗),所以颜色匀、通透好,但别指望天然深黄那种沉:它是清亮的暖,不是浓。","tradition":"(传统说法,非科学)黄=土,中式水晶文化里常把黄水晶系在\"财、聚财、招正财\"上;西方 lore 也叫它 merchant's stone(商人石)。落点都在自信、行动、把事做成,不在玄。","colorPsych":"(Heller)黄是最暖、最往外发的颜色,读作阳光、乐观、主动;但这颗是退了火的蜜黄不是高饱和正黄——读起来是\"晒过的暖\",不晃眼,是想被人靠近、不是想被人盯。","benefit":"它不让你赚到钱——是把\"该往前一步\"的暖意摆在你看得见的地方。给那种心里有数、就差松一口气往前推的人:一抬眼的暖,提醒你这事你做得成。","element":"补土(盘偏虚浮/缺落地、缺主心骨),也接土生金那条求财的线。内部用。"},{"id":"jx-064","cn":"茶晶","en":"Smoky Quartz","el":"water","color":"yellow_gold","wish":["energy","grounding","protection"],"teaser":"它不让你冷静下来——是给\"想往下沉一格、别再悬着\"的那股劲一个落点","material":"深烟褐色,接近黑的茶色——明度很低(L23),彩度也压得很低,所以它不亮、不抢,是那种\"半透但闷着\"的暗。对光看才看得见里头一点棕红的通透,平时就是一颗沉得下去的深茶珠。注意它不是名字里那种\"金\",是烟熏过的褐;库里偏暗的一颗,放一两颗压串脚刚好,堆多了整串会发闷。","tradition":"传统说法,非科学:茶晶/烟晶在水晶 lore 里常被当\"接地、卸力、挡杂念\"的石头——把飘起来的心思往下拽、把浊气往脚底排。石英家族本身管\"放大、清晰\",到了这层烟褐色,传统更强调它的\"收\"和\"稳\",而不是\"亮\"。(具体产地/成因不编,只说这层公认的象征。)","colorPsych":"挂 Heller/通用色彩心理:深褐近黑,读作扎实、安全、不张扬——是大地和木头的颜色,让人本能觉得\"踩得住\"。但烟褐≠死黑:黑是界限和庄重,烟褐多一层暖和半透,读作\"沉,但还透着气\",不冷硬。","benefit":"它不让你冷静下来——是给\"想往下沉一格、别再悬着\"的那股劲一个落点。给那种脑子转太快、容易飘的人:把这颗暗茶色摆在你低头就看得见的地方,像给思绪压一块石头。它代表落地,不替你落地。","element":"补水(内部用):el 为水,适合盘偏火燥、需要降一格、往下收敛接地的命盘;深暗色调本身也呼应\"沉、藏、静\"的水性。"},{"id":"jx-065","cn":"金箔胶花","en":"Flower Quartz","el":"earth","color":"gold","wish":["career","energy","grounding","intuition","wealth"],"teaser":"它不会给你带来财运——它代表\"把暖和落地这股劲摆在看得见的地方\"","material":"柔和的沙金色,半透到不透,里头悬着点点金箔的碎闪——这是带金箔的胶花/合成石英珠,不是天然纯水晶,那层\"金\"是做进去的装饰碎片,转动时一闪一闪。彩度偏低(lch C=21),所以它是暖而哑的奶金,不是亮晃晃的金属金;光照下温吞、像晒过的细沙,预览到手就是这种含蓄的暖。","tradition":"(传统说法,非科学;库里无此具体品种,借金色调与土行的公认 lore)金色在传统里系着\"丰盛、温暖、收成\";土行管\"稳、根基、把事落地\"。金箔嵌花的形态,民间常当作\"把暖意和好彩头封进石头里\"的装饰寓意——属意头,非功效。","colorPsych":"(Heller)金/暖黄是少数能直接读成\"温暖、富足、被照到\"的颜色,Heller 把金归入幸福与奢华那一类。但哑金跟刺眼的纯金不是一回事——这颗低彩度的沙金读起来是\"晒透了的暖\",踏实、不张扬,不抢戏。","benefit":"它不会给你带来财运——它代表\"把暖和落地这股劲摆在看得见的地方\"。给那种想把日子过踏实、又喜欢一点低调暖光的人:不必发光,自有底气。它提醒你,温度可以是稳的,不一定是亮的。","element":"补土(盘偏虚浮/缺根基、需要落地与稳定时用)。暖金调也顺带带一点土生金的过渡感,内部配盘可作温和的稳定位。"},{"id":"jx-066","cn":"金发晶水晶","en":"Golden Rutilated Quartz","el":"earth","color":"gold","wish":["career","energy","grounding","wealth"],"teaser":"它不让你发财——是把\"我在认真往前走\"这件事,做成一颗你低头就看得见的东西","material":"透到底的水晶里,封着一缕一缕金线——是天然包裹的金红石,不是镀上去的。底色是柔和的香槟金(L70/C21),不刺眼也不是那种廉价亮金:清透为主,金丝是点缀。光转一下,那几根金线会跟着亮一下又暗下去,所以好看在\"细看才发现里头有东西\",不是远看一团金。发丝的疏密每颗都不一样,这是真石头的样子,别指望两颗长得一模一样。","tradition":"传统说法(非科学):水晶本身在 lore 里管\"放大、清晰\";里头那缕金发,中式水晶文化常把它系在\"财气、事业气、行动力\"上,算偏阳、偏暖的一颗。归土(黄金色=土),旧说也常跟\"落地、聚气\"连一起。这些都是民俗象征,不是功效。","colorPsych":"金/暖黄在通用色彩心理里是\"暖能量、价值感\"那一类(Heller:金=贵重、被看重)。但这颗是收着的香槟金,不是张扬的纯金——浅金透底≠土豪亮金:它读起来更像\"低调的体面\",有底气但不喊。","benefit":"它不让你发财——是把\"我在认真往前走\"这件事,做成一颗你低头就看得见的东西。给那种闷头做事、不爱表态的人:那几缕金丝就当一个小提醒——你的劲儿是有方向的,不必到处证明。","element":"补土(盘虚浮/缺落地、收不住时)。色金归土,偏暖偏阳,适合需要\"站稳、聚住一股劲\"的盘。"},{"id":"jx-067","cn":"黑金超水晶","en":"黑金超水晶","el":"earth","color":"gold","wish":["career","energy","grounding","protection","wealth"],"teaser":"它不会让你变得有钱或刀枪不入——它代表\"扎下去、再慢慢攒\"那条路,把这件事摆在你低头就看得见的地方","material":"茶烟色的半透石英,底子是发闷的暖棕(L38·彩度才21,所以是低调的浊色不是亮金)——里头絮着黑色的针状矿和一缕缕偏金的发丝,所以叫\"黑金\"。它不是表面发光的那种珠子:光得照进去,才看见那些黑针和金丝悬在浑浊里。料子越天然杂质越多,这颗就是靠\"里头有东西\"取胜,不靠通透——别指望它像水晶球那样干净。","tradition":"(传统说法,非科学)这一类\"黑金超七/超水晶\"在坊间被当作\"集合数种矿于一身\"的石头,黑针(黑碧玺/黑发一路)管\"挡、定、立界\",金丝(金红石一路)管\"通财、提气\";石英大类传统里管\"放大、清晰\"。合起来的 lore 就是:既扎得住根,又往里聚一股暖劲。这些是民间象征,不是矿物学功效。","colorPsych":"(Heller/通用色彩心理)这颗压在\"棕+黑+一线金\"上:棕是大地、踏实、耐脏耐磨的颜色,读作\"可靠、不浮\";黑给它压出庄重和界限感。它不张扬——一个点是,浊暖里那缕金不是来抢眼的,是像\"埋在土里的那点底气\",越看越沉得住。","benefit":"它不会让你变得有钱或刀枪不入——它代表\"扎下去、再慢慢攒\"那条路,把这件事摆在你低头就看得见的地方。给那种在重建、在攒劲、不想喊口号的人:先站住,黑针替你守住边界,那缕金提醒你暖还在。一个落点,不是承诺。","element":"补土(盘虚浮/缺根、需要落地与稳定时)。土主厚载、定;这颗的浊暖棕调正是往\"沉、稳、收\"那头拉,适合给飘着、收不住的盘压一压。"},{"id":"jx-069","cn":"青金石","en":"Lapis Lazuli","el":"water","color":"blue","wish":["calm","communication","protection"],"teaser":"它不让你变聪明——是把\"沉下来、把话想清楚再说\"那一面摆在你看得见的地方","material":"深靛蓝,带细碎金点(黄铁矿)——不是宝石那种透亮蓝,而是闷在石头里的矿石蓝,半亚光、看得出是块\"石头\"不是玻璃。库里偏暗的一颗(明度低),所以它压得住场;那些金点是天然杂质不是镶嵌,星星点点,不均匀才是真货。","tradition":"(传统说法,非科学)青金石在古埃及/中亚 lore 里是\"天空与真相之石\"——磨成粉做过法老的眼影、神庙的颜料;传统象征智慧、说真话、第三眼/直觉。深蓝配金点常被读成\"夜空与星\",所以也系在\"看清、想明白\"上。","colorPsych":"(Heller)深蓝是最多人投票\"可信\"的颜色,读作沉静、专注、有分量;越往暗里走越像\"夜里的脑子转得清\"。比起轻飘飘的天蓝,这种闷靛蓝不是放空,是\"沉下来想事\"——金点又给它一点不冷的暖。","benefit":"它不让你变聪明——是把\"沉下来、把话想清楚再说\"那一面摆在你看得见的地方。给那种容易被吵醒、想守住自己一块安静判断力的人:一个往里收、不必急着接话的落点。","element":"补水(盘偏火燥/急、需要降一格、立界限、稳住判断)。"},{"id":"jx-070","cn":"蓝晶石","en":"Kyanite","el":"water","color":"blue","wish":["calm","communication","energy","protection"],"teaser":"它不会替你开口——是给\"想把话说清楚、又怕一急就走样\"的那一面一个落点","material":"不是鲜亮的宝石蓝——是带灰的钢青蓝(L48 中暗、彩度低到 23),色不匀,珠子里常能看见走向不一的丝纹/深浅条带,这正是蓝晶石本来的样子(原矿是片状解理的\"刀片\")。一颗安静、不抢戏的中调蓝,放手串里是压色的那颗,不是发光的那颗。","tradition":"(传统说法,非科学;库里无此具体品种,沿用蓝色水石家族公认 lore)蓝晶石在西方晶石 lore 里系在\"喉轮、把话说清楚、说真话\"上;蓝色水石这一类(海蓝宝/蓝纹玛瑙/青金)传统都管表达、沟通、安宁与真相。蓝晶石另有一说是\"不留负能量、自己保持澄澈\"的石头——当传说看,别当功效。","colorPsych":"(Heller)冷蓝是最多人偏爱、读作可信与安宁的颜色;但这颗是带灰的钢青蓝,不是甜的天蓝——它读起来更冷静、更\"成年人\",像一句压低了的、笃定的话,而不是亮蓝那种讨好。","benefit":"它不会替你开口——是给\"想把话说清楚、又怕一急就走样\"的那一面一个落点。给那种心里有数、却总在嘴边卡住的人:把这颗沉蓝摆在手腕上看得见的地方,提醒自己慢一格、把那句真话说稳。","element":"补水(盘火燥/需降一格、立界、把情绪与表达理顺)。"},{"id":"jx-071","cn":"蓝月光水晶","en":"Blue Moonstone","el":"water","color":"blue","wish":["calm","communication","protection"],"teaser":"它不让你冷静下来——是给你\"软下来还能想清楚\"的那一面一个落点","material":"珠体本身是浅灰白、几乎不带彩度的素色(明度 63、彩度才 5),所以那点蓝不在底色里——它浮在表面,是抛光后才出来的一层游移月光晕。转一下角度,蓝光从珠子里滑过去;不转,它就是一颗安静的灰白珠。它是\"会闪一道蓝\"那种,不是通体湛蓝;预览里那道蓝是侧光才点亮的,正面平光时偏素。","tradition":"传统说法(lore,非科学):月光石大类公认系在\"直觉、新的开始、旅人护身\"上,女性能量与月相相连;那层蓝晕尤其被讲成\"安抚情绪、把心里的话说出口\"。库里没收这具体品种,以上按月光石大类的公认 lore 说,保守不细化产地。","colorPsych":"挂 Heller:冷蓝是最多人偏爱、读作可信与安宁的颜色。但这颗不靠饱和蓝取胜——它彩度极低、是化在灰白里的一抹蓝晕,所以整颗读作\"往里收的梦感\",冷静但不冷硬,像隔着雾看见的那点光。","benefit":"它不让你冷静下来——是给你\"软下来还能想清楚\"的那一面一个落点。给一上头就找不到话、或正站在某个新开始门口的人:那道要侧光才亮的蓝,本身就让人盯着、慢一格,把要说的话先在心里捋顺。","element":"补水(内部用):给盘偏火燥、需要降一格、立界、把情绪和表达理顺的人。"},{"id":"jx-072","cn":"老矿料天河石","en":"Amazonite","el":"water","color":"blue","wish":["calm","communication","protection"],"teaser":"它不让你变得会说话——是给\"想把话讲清楚、又怕一急就乱\"的那一面一个落点","material":"蓝中带青的湖水色,不通透,温吞的半哑光——明度中等(58)、彩度很低(24),所以它不抢眼,是那种\"安安静静一片\"的蓝绿。老矿料常带白筋和深浅斑驳的色块,不是均匀一色;别指望它像玻璃那样亮,它读起来更像被磨砂过的浅水。","tradition":"(传统说法,非科学)天河石/Amazonite 在西方水晶 lore 里是\"喉轮石\",系在\"把心里话说出口、说真话\"上;也常被叫作\"希望之石、勇气之石\",传统上当作安抚情绪、挡掉外界杂音的护符。这些都是民间象征,不是已证实的功效。","colorPsych":"(Heller)冷蓝是最多人偏爱、读作可信与安宁的颜色;但它这股蓝里掺了青绿,不是纯净海蓝那种\"清澈\",而是带土气的\"平静\"——像静水而非晴空,读作\"稳下来再开口\",不是兴奋的那种蓝。","benefit":"它不让你变得会说话——是给\"想把话讲清楚、又怕一急就乱\"的那一面一个落点。给那种心里有数、却总在该开口时卡壳的人:把这片静水色摆在手腕上,提醒自己慢半拍、再说。","element":"补水(盘火燥/急躁、需要降一格、沉得住气再表达)。"},{"id":"jx-073","cn":"蓝虎眼石","en":"蓝虎眼石","el":"water","color":"blue","wish":["calm","communication","energy","focus","protection"],"teaser":"它不让你看穿什么——是把\"先看清再开口\"的那一格停顿,做成你手腕上看得见的一颗深蓝","material":"深钢蓝偏灰,L 只有 30、彩度也压得低(lch 30/27)——是那种沉到底的暗蓝,不是亮蓝。它是虎眼石家族里的\"鹰眼\"一支:同样的猫眼丝光,只是颜色从金棕换成了冷蓝灰。抛光后顺着丝理转一下,能看见一道窄窄的银蓝光带在珠面上游走;不转就是一颗安静的深蓝。库里偏暗的一颗,放进浅色串里压得住场。","tradition":"(传统说法,非科学)虎眼石在 lore 里管\"洞察、意志、把想法落成行动\";蓝/鹰眼这一支传统上更往\"看得远、冷静观察、护住自己的判断\"那边走。蓝色本身在传统里又系着沟通与表达。","colorPsych":"(Heller)冷蓝是最多人偏爱、读作可信与安宁的颜色;但这颗是压暗压灰的深蓝,不是清亮的天蓝——它读起来更像\"沉住气的那种冷静\",带一点钢的硬度,而不是软绵绵的安抚。那道游移的丝光给这份冷加了一点不动声色的锋。","benefit":"它不让你看穿什么——是把\"先看清再开口\"的那一格停顿,做成你手腕上看得见的一颗深蓝。给那种容易上头就先说、事后才后悔的人:低头看一眼这道冷光,慢半拍,把判断收回自己手里。","element":"补水(盘火燥/急躁、需要降一格冷静下来、立住自己的界);el=water。"},{"id":"jx-074","cn":"湖水蓝萤石","en":"Fluorite","el":"wood","color":"blue","wish":["career","love"],"teaser":"它不让你变清醒——是给\"脑子一团乱、话堵在嗓子里\"的时候一个落点","material":"湖水蓝萤石,正经是它那名字:像晴天浅水塘的蓝,清透但不冲——L60 摆在中间,彩度低(C19),所以是种被冲淡过的安静蓝,不是宝石那种刺眼的湖蓝。萤石本身偏软、易裂,抛光后透中带一点点雾,珠面常见天然的色带分层(深一道浅一道),不是均匀实色;别指望它像玻璃那么硬亮,它是温吞、好上手的那种透。","tradition":"(传统说法,非科学)萤石在水晶圈被叫\"天才之石\",lore 里管\"理清思路、把乱掉的念头排好队\";绿萤石主成长疗愈,蓝色这一支偏向沟通、表达、把心里的话顺出来。属木,传统对应\"生长、舒展\"。这些是民间 lore,不是功效。","colorPsych":"(Heller)冷蓝是被最多人偏爱、几乎全票读作\"可信与安宁\"的颜色;而这颗是低饱和的浅蓝,蓝里掺了被稀释的清——它不喊\"信我\",它读作\"先别急,慢一格再说\"。一颗安静色,适合压住一串里太吵的那几颗。","benefit":"它不让你变清醒——是给\"脑子一团乱、话堵在嗓子里\"的时候一个落点。给那种心里明明有答案、却理不出顺序的人:盯一眼这道浅水蓝,先把节奏调慢,再开口。把它戴在手腕上,等于把\"慢下来想\"摆在你随手就摸得到的地方。","element":"补木(盘缺生长力/思路滞、需要疏通舒展的人)。内部用:木主条达,蓝萤石给偏堵、偏僵的盘添一股\"理顺、往外伸\"的劲。"},{"id":"jx-075","cn":"老矿料天河石","en":"Amazonite","el":"water","color":"blue","wish":["calm","communication","protection"],"teaser":"它不让你变会说话——是把\"先稳住、再开口\"那个状态摆在你看得见的地方","material":"不透的雾蓝绿——介于湖水和薄荷之间那种偏冷的灰青,L58 中等明度、彩度只有22,所以是\"被磨钝过\"的蓝绿,不是糖果绿。老矿料天河石常带白色筋纹和细小斑点,那是长石本来的脾气,不是瑕疵;它在一串里是温吞收光的那种,不抢、也不亮。","tradition":"(传统说法,非科学)天河石/Amazonite 在西方水晶 lore 里被叫\"勇气石、希望石\",传统系在喉轮——管\"把心里话说出口\"和\"安抚情绪、化解焦虑\";因偏绿蓝,也常被归到平和、止争那一路。这些是民间象征,不是验证过的功效。","colorPsych":"(Heller)蓝是最多人偏爱、本能读作可信与安宁的颜色;掺进绿之后多了一层\"生长、缓和\"的意思。但这颗是钝化的灰青——雾蓝绿≠鲜亮孔雀绿,它读作\"安静、不上头\",像把音量先调小一格。","benefit":"它不让你变会说话——是把\"先稳住、再开口\"那个状态摆在你看得见的地方。给那种一急就语塞、或一争就上头的人:一个让自己慢半拍、把话理顺再说的落点。","element":"补水(盘火燥/口舌争执多、需降一格、立界、把情绪压平)。"},{"id":"jx-076","cn":"天河石","en":"Amazonite","el":"water","color":"blue","wish":["calm","communication","protection"],"teaser":"它不会替你把话说出来——是给\"想清楚再开口\"的那一面一个落点","material":"不透明的青蓝带一点绿——介于湖水和薄荷之间那种偏冷的灰蓝,亮度中等、彩度不高,所以不抢眼。常带白色丝纹或浅斑,是石头本来的纹理,不是瑕疵;它不是会\"发光\"的那种珠,是哑光、安静、放在一串里压得住场的底色。","tradition":"(传统说法,非科学)天河石在西方传统里被叫作\"希望之石 / Hope Stone\",lore 系在\"把话说清楚、稳住情绪、设个界限\"上;那点偏绿的蓝,传统上也关联沟通与自我安抚——说出口、又不失分寸。","colorPsych":"(Heller)冷蓝是最多人偏爱、读作可信与安宁的颜色;天河石这种掺了绿的灰蓝又比纯蓝多一分生长感(绿=生长),整体读作\"冷静里带着活气\"——不是冰,是退一步后的清醒。","benefit":"它不会替你把话说出来——是给\"想清楚再开口\"的那一面一个落点。给那种一急就口不择言、事后又懊悔的人:把这颗哑光的蓝绿摆在你看得见的地方,提醒自己慢半格、把界限说明白,不用提高音量。","element":"补水(盘偏火燥、心浮气躁、需要降一格、立界与沟通的人)。"},{"id":"jx-077","cn":"蓝月光","en":"Blue Moonstone","el":"water","color":"blue","wish":["calm","communication","protection"],"teaser":"它不让你冷静——是给\"软下来还能想清楚\"的那一面一个落点","material":"浅灰蓝、雾蒙蒙的乳白底——彩度极低(几乎不偏色),亮度中上,所以它不是\"蓝水晶\"那种实蓝,是一颗安静、半透、像隔了层水汽的珠子。好的料抛光后底子上会浮一层游移的冷蓝晕,转一下那道光从珠里滑过;但素净是它的本相,别指望整颗发亮蓝,那是误图。","tradition":"(传统说法,非科学;库内无月光石单独条目,以下为月光石大类公认 lore)月光石在多地传统里被当作直觉、新开始与旅人的护符;蓝晕这一支尤其被系在\"安抚情绪、把话说出口\"上。归水,与沟通、内省相应。","colorPsych":"(Heller/通用色彩心理)冷蓝是最多人偏爱、被读作可信与安宁的颜色;但这颗的蓝被乳白压到很淡——不是清醒的天蓝,是化不开的雾蓝,整颗读作\"往里收\"的梦感,而不是向外的明亮。一个点:它安静,不抢话。","benefit":"它不让你冷静——是给\"软下来还能想清楚\"的那一面一个落点。给一上头就找不到话、或习惯把情绪憋成沉默的人:把这道收着的蓝晕摆在你手腕上看得见的地方,提醒自己慢一格、再开口。","element":"补水(盘偏火燥、需降一格或立界、需要内省与沟通的人);内部按 el=water 调度。"},{"id":"jx-078","cn":"海蓝宝","en":"Aquamarine","el":"water","color":"blue","wish":["calm","communication","protection"],"teaser":"它不会让你冷静下来——是把\"先别急着回嘴\"的那一面，放在你看得见的地方","material":"很淡的天蓝偏青，像隔着雾看海面——明度高、彩度低(lch L76、C14)，不是宝石那种透亮饱和的蓝，而是带一点灰雾的浅水蓝。半透到微浑，光进去是散开的、柔的，不抢眼。颜色很轻，所以一串里它退在后面当底色，而不是当主角。","tradition":"传统说法(lore，非科学)：海蓝宝在西方一直是\"水手护身石\"，传说能让出海的人平安、海面平静；中式归水，对应\"安宁、沟通、冷静\"，是说话讲理、想把情绪降一格时的辅石。这些是文化象征，不是它真能做什么。","colorPsych":"挂 Heller：浅冷蓝是最多人偏爱、读作\"可信、安宁\"的颜色；它带一点灰雾，比纯蓝更软，整颗读起来像\"退后半步、把火气放下\"的那种安静。不是冰，是凉而松的那种凉。","benefit":"它不会让你冷静下来——是把\"先别急着回嘴\"的那一面，放在你看得见的地方。给那种一上头话就冲、事后又后悔的人：浅雾蓝≠刺眼的冰蓝，它代表的是松弛地讲清楚，而不是憋着。一个让自己慢半拍的落点。","element":"补水(盘偏火燥、需要降一格、把话讲缓、立点界限的人)。它色轻力柔，适合当水属性的底色调，而不是单点的强补。"},{"id":"jx-079","cn":"海蓝宝","en":"Aquamarine","el":"water","color":"blue","wish":["calm","communication","confidence","protection"],"teaser":"它不让你变冷静——是把\"先别急、把话好好说\"那一面摆在你看得见的地方","material":"浅蓝带一丝灰绿,像隔着雾看海水那种淡——LAB 彩度很低(a-9/b-15),不是宝石店打光下那种饱满\"海水蓝\",到手是温吞、收着的浅蓝。透感中等,清透但不抢眼。它是一串里偏安静的底色珠,适合铺量、垫人,不适合当唯一主角。","tradition":"(传统说法,非科学)海蓝宝在西方 lore 里是\"水手护身石\",传说能让海面平静、护人远行平安;颜色系到水,中式归\"水\"行,民间常把它跟\"安宁、沟通、把话顺出来\"绑在一起。这些都是传统象征,不是疗效。","colorPsych":"(Heller)冷蓝是被偏爱最多、最被读成\"可信与安宁\"的颜色;而这颗是低彩度的淡蓝——比正蓝更软,少了锋利,多了\"退一步、不争\"的味道。一个点:它不让人警觉,反而让眼睛松下来。","benefit":"它不让你变冷静——是把\"先别急、把话好好说\"那一面摆在你看得见的地方。给那种话到嘴边容易冲、事后又后悔的人:一个让自己慢半拍的落点。","element":"补水(盘偏火燥/急、需降一格、把沟通和情绪理顺)。"},{"id":"jx-080","cn":"海蓝宝","en":"Aquamarine","el":"water","color":"blue","wish":["calm","communication","protection"],"teaser":"它不让你嘴变利——是给\"先沉一下再开口\"的那一面一个落点","material":"浅海水那种淡蓝绿，明度高、彩度低——是被水冲淡过的蓝，不是宝蓝那种饱。天然海蓝宝多半带点雾感、不完全透，所以它在串里是\"清浅、安静\"的那颗，不抢光，靠的是干净。别指望它像玻璃一样亮，它的好正在于那口淡。","tradition":"传统说法(非科学)：海蓝宝在西方被叫\"海之石\"，是水手出海的护身符，求平安归航；也长期系在\"安宁、把话顺畅说出口、冷静沟通\"上。这些是 lore，不是功效。","colorPsych":"色彩心理(Heller)：蓝是最多人偏爱、被读作可信与安宁的颜色；而这种掺了绿的淡蓝，比正蓝更松、更凉，读起来不是\"冷峻\"，是\"水边的那种缓\"——降一格的安静。","benefit":"它不让你嘴变利——是给\"先沉一下再开口\"的那一面一个落点。给那种话到嘴边容易堵、或一急就说重的人：把这口淡蓝戴在手腕上，看见它，慢半拍再讲。","element":"补水(盘偏火燥、需要降一格、把急话压住、立住分寸)。"},{"id":"jx-081","cn":"海蓝宝","en":"Aquamarine","el":"water","color":"blue","wish":["calm","communication","confidence","protection"],"teaser":"它不让你嘴变利——是给\"先稳住、再开口\"的那一面一个落点","material":"浅水蓝,偏淡偏灰的那种(彩度很低、明度高)——不是宝石广告里那种饱和蓝,更像晴天兑了水的天色,清透但安静。半透,光打进去是柔的,不抢戏。它是一串里负责\"留白\"的那颗,放多了也不吵,反而把别的颜色衬亮。","tradition":"传统说法(非科学):海蓝宝在西方是水手护符、旅人的平安石;中式收纳进\"水\"属,主安宁、沟通、冷静。那层水蓝尤其被系在\"把心里的话顺出来、把急火降一格\"上。这些是 lore,不是功效。","colorPsych":"挂 Heller:冷蓝是最多人偏爱、读作可信与安宁的颜色。但这颗是淡灰蓝,不是扎眼的湖蓝——它读起来更像\"已经松开了的那口气\",克制、有距离感,不黏人。","benefit":"它不让你嘴变利——是给\"先稳住、再开口\"的那一面一个落点。给那种一急就语无伦次、事后才想到该怎么说的人:把这片淡蓝摆在腕上你低头看得见的地方,提醒自己慢半拍,话自然顺一点。","element":"补水(盘火燥、性子急、需要降一格、把界限说清楚的人)。"},{"id":"jx-082","cn":"孔雀石","en":"Malachite","el":"wood","color":"green","wish":["career","love"],"teaser":"它不会替你把生活理顺——是把\"该慢慢长、别急\"这件事,摆在你低头就看得见的地方","material":"深墨绿,不是嫩绿——明度压得很低(库里偏暗的一颗),彩度也不高,所以绿得沉、绿得旧。真孔雀石的招牌是那一圈圈深浅不一的同心环带:抛光后像浓淡两种绿被卷在一起,每颗的纹路都不一样,没有两颗长得一模一样。摆在串里是\"压得住场\"的那种重绿,不是清新水绿,别指望它亮。","tradition":"(传统说法,非科学)孔雀石在民间一直被当作\"护身/挡灾\"的石头——古时把它磨粉做颜料,也戴着挡邪、护出行;那一圈圈眼睛似的环纹,被说成能\"替你看着、替你挡一下\"。绿色这一脉,传统里系在\"生长、心口、把日子重新理顺\"上。这些是 lore,不是功效。","colorPsych":"(Heller)绿是最少惹人反感、读作生长与疗愈的颜色;但深墨绿跟嫩绿是两回事——嫩绿是\"刚冒头\",深墨绿读作\"已经长了很久、扎得很深\"的那种稳。配上同心环纹,整颗有种\"年头在里头\"的旧感,不轻飘。","benefit":"它不会替你把生活理顺——是把\"该慢慢长、别急\"这件事,摆在你低头就看得见的地方。给那种正在重新理一段关系或一份事的人:那圈圈纹路提醒你,深的东西都是一圈一圈绕出来的,不是一下子的。","element":"补木(盘缺木/缺生长之气、想把停住的事重新带动起来)。库里木属性石本就少,这颗是少数能撑木位的深色选择。"},{"id":"jx-083","cn":"天然聚宝盆绿幽灵","en":"Green Phantom Quartz","el":"wood","color":"green","wish":["career","love","wealth"],"teaser":"它不让你发财——是把\"一点点攒、不急着证明什么\"这件事,做成一颗你低头能看见的珠子","material":"透白水晶里关着一层雾绿的内含物——不是整颗染绿,是绿藏在透明里(绿幽灵=水晶里包了绿色矿物)。lch 彩度只有 6,所以这绿很淡很哑,像隔着水看青苔,不是翠绿那种亮。明度居中,整颗半透不刺眼;每颗里那团绿的位置都不一样,所以一串里不会有两颗长得完全一样。","tradition":"(传统说法,非科学)绿幽灵在中式水晶圈被叫\"聚宝盆\",传统里系在正财、事业累积上——讲的是\"一点点攒起来\"那种财,不是横财。底层是水晶大类的老说法:管放大、聚拢、把心里的事理顺。具体到这个品种的精确产地/成分别外推,以上都是 lore。","colorPsych":"绿是色彩心理里读作\"生长、疗愈、安心\"的颜色(Heller:绿=生命与希望)。但这颗的低彩雾绿跟亮翠绿是两回事——亮翠喊\"快长大\",这团哑绿更像\"在长,只是慢\"。透明打底,看着不挤,有留白感。","benefit":"它不让你发财——是把\"一点点攒、不急着证明什么\"这件事,做成一颗你低头能看见的珠子。给那种在闷头积累、还没到收成、容易怀疑自己走得对不对的人:那团绿就在那儿,提醒你东西在长。","element":"补木(盘缺生发力/想推事业与成长这一轴)。木主生长、规划、往上走,适合盘里行动有了但\"持续往上长\"的那口气不足的人。"},{"id":"jx-084","cn":"湖水绿萤石","en":"Fluorite","el":"wood","color":"green","wish":["career","focus","love"],"teaser":"它不让你想通——是给\"先把乱的理顺、再往前走\"的那一面一个落点","material":"湖水绿——不是翠绿,是掺了点灰蓝的那种淡绿,像浅水塘的颜色(LAB 偏绿带一点蓝、彩度很低)。萤石本身偏软、偏透,光进去是清润的,不是水晶那种硬亮;明度中等,所以它在一串里是\"退后一格\"的安静色,不抢戏。","tradition":"(传统说法,非科学)绿萤石在 lore 里管\"成长、疗愈、把心里乱掉的东西理顺\";绿色一向系在\"生长、修复\"上,萤石尤其被传成\"整理思绪、收摊子\"的那颗石头。","colorPsych":"(Heller)绿是最被读作\"生长与放松\"的颜色,人盯着会不自觉松一口气;这颗又是低饱和的湖水绿——淡绿≠扎眼的荧光绿——它读起来不是\"使劲长\",是\"慢慢缓过来\"。","benefit":"它不让你想通——是给\"先把乱的理顺、再往前走\"的那一面一个落点。给那种事情一多就脑子打结的人:那片淡绿摆在手腕上,是提醒你可以慢一格、一样一样来。","element":"补木(盘缺生长、需要舒展/理顺的那一格)。"},{"id":"jx-085","cn":"葡萄石","en":"Prehnite","el":"wood","color":"green","wish":["career","love"],"teaser":"它不让你想通——是把\"慢慢长、别急着定\"摆在你看得见的地方","material":"奶油黄绿,半透不通透——像剥开的青葡萄肉,光进去是雾蒙蒙化开的,不是翡翠那种水亮绿。彩度很低(lch C23),所以它是\"安静的绿\",一串里当底色铺最好,想靠它抢眼会落空。","tradition":"(传统说法/lore,非科学;库里无此具体品种,用葡萄石大类公认说法)葡萄石在西方水晶圈被叫作\"无条件之爱与疗愈之石\",传统associations系在\"理清思绪、放下旧执念、让纠结的心重新长出方向\"上;绿色在中式五行里属木,主生长、向上、生发。","colorPsych":"(Heller)绿是最不累眼、读作生长与平静的颜色(绿=生命/疗愈/希望);而这种偏黄的低饱和橄榄绿,比鲜绿更柔、更\"新芽\"——读作\"刚冒头、还在长\"的那种安心,不喧哗。","benefit":"它不让你想通——是把\"慢慢长、别急着定\"摆在你看得见的地方。给那种心里堵着一团、想理顺又怕逼自己的人:一个可以缓一格、让事情自己长开的落点。","element":"补木(盘缺生长力/卡住、没方向、需向上生发的一格)。"},{"id":"jx-086","cn":"绿幽灵聚宝盆水晶1","en":"Green Phantom Quartz","el":"wood","color":"green","wish":["career","love","wealth"],"teaser":"它不会替你把钱赚来——是把\"一点点攒、稳着长\"的那股劲摆在你看得见的地方","material":"透白水晶里悬着一层雾绿的内含物——绿幽灵的\"幽灵\"就是这层飘在水晶里的绿絮，不是整颗染绿。库里这颗实际偏淡:乳灰底上一抹清浅的雾绿(lch L73/C6,彩度很低),是雅致的灰调绿,不是浓墨那种翠。看着像隔着薄雾看一汪静水里沉着的草色，安静、不抢戏。","tradition":"(传统说法,非科学)绿幽灵在中式叫\"聚宝盆\"——那层堆在底部的绿絮被看作\"招财纳福、把好运攒在盆里\"的象征,传统上系在事业起步、积累、稳步生长上;绿色本身又关联生机与生长。这些是文化 lore,不是已证实的功效。","colorPsych":"(Heller)绿是被读作生长、平衡、疗愈的颜色——最不让人紧张的那一类。这颗的绿又压得很低、偏灰,不是扎眼的鲜绿,所以读起来不是\"猛长\",而是\"慢慢往上、稳稳铺开\"的那种生机。","benefit":"它不会替你把钱赚来——是把\"一点点攒、稳着长\"的那股劲摆在你看得见的地方。给那种不信一夜暴富、愿意慢慢垒的人:每天攒一点,盆总会满。","element":"补木(盘缺生长力/事业起不来、需要\"往上长\"的那股劲)。"},{"id":"jx-087","cn":"青提奶盖玉手串","en":"青提奶盖玉手串","el":"wood","color":"green","wish":["career","love"],"teaser":"它不会让你的事业或感情变好——是把\"慢慢长、稳着来\"这件事摆在你看得见的地方","material":"青提色的玉珠,带一点奶白雾感的半透——不是翠绿,是偏黄的橄榄绿(色相107、彩度中等),像剥开的青提肉。光打进去是糊在里头的柔光,不透亮也不冒油光;它是这串里\"安静、不抢眼\"的那颗底色珠,适合大面积铺,不适合当主角。","tradition":"(传统说法,非科学)玉在中式里向来管\"温润、保平安、藏而不露\",讲的是君子那股不张扬的稳;绿色一系在传统里又系着\"生发、生机、往上长\"。这颗具体品种库里没有定论,只说玉这一大类的公认 lore,不夸精确产地或功效。","colorPsych":"(Heller)绿是最多人读作\"生长、疗愈、让人松一口气\"的颜色,情绪上最安全;但这颗偏黄的奶青绿跟扎眼的翠绿是两回事——它读作\"温的、刚冒头的新绿\",像清晨没睡醒的那种生机,养眼而不刺激。","benefit":"它不会让你的事业或感情变好——是把\"慢慢长、稳着来\"这件事摆在你看得见的地方。给那种不想急、想温温地往前推一步的人:不必使劲,先占住一个安静的位置。","element":"补木(盘缺生发力/想往上长但起不来的劲)。内部用:木弱、需要一点温和向上能量的盘适合点这颗打底。"},{"id":"jx-088","cn":"葡萄绿萤石","en":"Fluorite","el":"wood","color":"green","wish":["career","love"],"teaser":"它不让你想通什么——是把\"先把脑子腾干净再说\"这件事,摆在你低头就看得见的地方","material":"柔和的雾感浅绿,带一点灰、一点蓝调,像隔着磨砂玻璃看的嫩叶——不是翡翠那种艳绿。萤石本身偏脆、透度温吞,所以是\"半透的清冷\",光进去是散开的,不会扎眼。明度高、彩度低(L69·C17),在一串里是退后一步、让眼睛歇下来的那颗,不抢戏。","tradition":"(传统说法,非科学)萤石在 lore 里管\"清理脑子、把乱的东西理顺\"——绿萤石尤其系在成长、疗愈、心灵整理上。绿色本身在传统里连着生发与新芽。这是象征联想,不是它真能做什么。","colorPsych":"(Heller)绿是最让人放松、读作生长与疗愈的颜色;而这种掺了灰的低饱和浅绿,不是充满干劲的那种\"新绿\",更像清晨刚醒、还没忙起来的那一格安静——往下压火气,而不是往上催。","benefit":"它不让你想通什么——是把\"先把脑子腾干净再说\"这件事,摆在你低头就看得见的地方。给那种心里塞了太多、一坐下就千头万绪的人:一个让思绪落地、重新排队的安静角落。","element":"补木(盘缺生发力/思路堵、需要松开往前长)。"},{"id":"jx-089","cn":"薄荷绿萤石","en":"Fluorite","el":"wood","color":"green","wish":["career","focus","love"],"teaser":"它不让你专注——是给\"想把一团乱理出个头绪\"的那种状态一个落点","material":"通透的薄荷绿,亮度高、彩度低——不是浓翠,是被水稀过的那种淡绿,带一点偏冷的蓝调。萤石本就软、本就透,光打进去是清浅、半冰糖的质感,不是硬玉那种瓷实。它在一串里属于\"退后半步\"的浅色,放亮整体、不抢戏;但也正因软,它不是耐磨的硬石头。","tradition":"(传统说法,非科学)萤石在 lore 里管\"理清思绪、给脑子降噪\",常被叫作专注与心灵整理的石;绿色那支尤其系在\"成长、舒缓、把乱掉的心收一收\"上。这些是传统象征,不是功效。","colorPsych":"(Heller)绿是公认最让人松一口气的颜色,读作生长、舒缓、回到平衡;而这颗的淡薄荷又比深绿更轻、更冷,带一点透气感——不是郁郁葱葱的森林绿,是清晨那种\"刚醒、还没满\"的绿。","benefit":"它不让你专注——是给\"想把一团乱理出个头绪\"的那种状态一个落点。给那种脑子总是开着十几个窗口的人:把这抹清浅的绿摆在你看得见的地方,提醒自己可以一次只做一件。","element":"补木(盘里木弱/缺生长舒展之气、需要把僵住的局面松开一格)。库里唯一的木属性石。"},{"id":"jx-090","cn":"银耀石手串","en":"Silver Obsidian","el":"water","color":"silver_gray","wish":["energy","grounding","protection"],"teaser":"它不挡掉什么——是把\"沉得住、不必解释\"那股劲摆在你手腕上看得见的地方","material":"深炭灰近黑的火山玻璃,抛光后表面浮一层银白的丝绒光晕——转一下,亮区像月亮在石头里挪一格。底色其实很暗(库里偏深的一颗),所以那层银不是亮闪,是雾面里透出来的冷光;不是金属、不是水晶,是天然玻璃,凑近看温润不扎眼。","tradition":"(传统说法,非科学)黑曜石一类在民间长期当\"挡、收、护\"的石头——辟邪、挡负能量、把人往下拉稳;银耀这层光晕又被说成\"照见\"的意味,像一面暗镜。库里没单列这个品种,以上按黑曜石大类公认 lore,保守取。","colorPsych":"(Heller/通用)灰黑是最庄重、最有界限感的颜色:黑=界限/沉静,银灰=克制的高级。它不抢眼,反而读作\"我有底、不外露\";那层游移的银光给这份沉一点不闷的呼吸。","benefit":"它不挡掉什么——是把\"沉得住、不必解释\"那股劲摆在你手腕上看得见的地方。给那种容易被外面带着跑、想先把自己站稳的人:一个往下扎、把边界划清的落点。","element":"补水(盘火燥/缺沉静、需立界与收敛)。这颗 el=water,暗色调强化\"往里收、往下沉\"的水性。"},{"id":"jx-091","cn":"紫牙乌石榴石手串","en":"Garnet","el":"fire","color":"purple","wish":["calm","energy","focus","intuition","sleep_light"],"teaser":"它不让你打鸡血——是把\"安静地有劲\"这件事摆在你看得见的地方","material":"紫牙乌是石榴石里偏紫调的那种,深到近乎黑的酒红——L 只有 16,是库里压得最暗的红之一。玻璃光泽、半透,光照进去才在边缘透出一点葡萄酒紫,平时看就是一颗沉静的暗红珠。颗粒匀、不抢眼,深酒红≠那种亮闪的红宝色,它走的是内敛路子。","tradition":"(传统说法,非科学)石榴石在西方 lore 里是旅人护石、归来与忠诚的象征,被当作\"点火重启\"的能量石;紫牙乌这一支因偏紫,传统上又添一层沉静、向内的意味。东方多取其\"红\"作辟邪、添活力之用。以上均为民俗象征,不是功效。","colorPsych":"(Heller)红是身体不过脑就读成\"活、动、热\"的颜色(红=生命力/激情);但这颗压到暗酒红又掺了紫,亮红的躁劲被收住了——读起来是\"沉住的劲\",像炭火不是明火。紫的那一点又带进一丝神秘、向内(紫=神秘/高贵)。","benefit":"它不让你打鸡血——是把\"安静地有劲\"这件事摆在你看得见的地方。给那种不想靠喧闹证明自己、却要在心里燃着一团火的人:一个低调的落点,提醒你劲还在。","element":"补火(盘偏冷、缺行动力/驱动);这颗的暗调让它补得温和不冲,适合需要点火又怕过燥的盘。"},{"id":"jx-092","cn":"紫牙乌石榴石","en":"Garnet","el":"fire","color":"purple","wish":["calm","energy","focus","intuition","sleep_light"],"teaser":"它不给你能量——是给\"被掏空之后还想再站起来\"的那股劲一个看得见的落点","material":"深酒红偏一丝紫调的暗石榴红(紫牙乌就是石榴石的老叫法,不是真紫)。L 只有 27,是这串里最暗的几颗之一;彩度也不高,所以它不亮、不跳,是那种压在底下的酽红——像红酒兑了墨。半透到微透,光只能勉强渗进边缘,大部分时候它就是一颗沉甸甸、收着光的暗珠。别指望它闪。","tradition":"(传统说法,非科学)石榴石这一大类在西方 lore 里管\"根基、生命力、把人从耗竭里拽回来\",常系在最底下那个根轮上;名字来自石榴籽,象征\"满、聚、回流\"。中式把这种暗红石笼统归进辟邪、固本的暖石。具体到紫牙乌这个品种的精确产地/特性,库里没有,以上按石榴石大类的公认 lore 说,保守。","colorPsych":"(Heller)红是身体最先读到的颜色,默认接生命力、激情、向前;但近敌要切清——这颗不是扎眼的正红,是压暗的酒红(暗红≠鲜红)。Heller 里暗红读作\"成熟、收敛、被压住的力\",加上那一丝紫调,整颗像\"还在烧、但不外露\"的暗火。","benefit":"它不给你能量——是给\"被掏空之后还想再站起来\"的那股劲一个看得见的落点。代表往根上收、把自己重新攒回来。给那种表面撑着、其实已经很累的人:摆一颗在低头能看见的地方,提醒自己先回到地面,再谈往前。","element":"补火(盘偏冷、行动力/精气被耗、需要重新点起底火);内部用,火行的暗能量位,不抢火 hero 的光,做压舱的根。"},{"id":"jx-093","cn":"玻利维亚紫水晶","en":"Amethyst","el":"fire","color":"purple","wish":["calm","energy","focus","intuition","sleep_light"],"teaser":"它不让你冷静下来——是给\"上头之后还想把自己拽回来\"的那个动作一个落点","material":"偏灰的烟紫,不是那种攥得满手的浓葡萄紫——玻利维亚这一脉本就淡、本就带一层雾。彩度不高(lch 彩度 29),亮度中等,所以它在串里是\"安静的紫\",不抢光;转一下,色不均,深一块浅一块,那是天然紫晶的色带,不是瑕疵。要浓紫该选乌拉圭那颗,这颗的脾气是收着的。","tradition":"传统说法(lore,非科学):紫水晶在西方传统里管\"清醒、节制、不上头\"(古希腊拿它当醒酒石),也常被系在冥想、直觉、顶轮上——一颗让人\"往上走一格、别被冲昏头\"的石头。这些是流传的象征,不是被验证的功效。","colorPsych":"紫在 Heller 的统计里是最矛盾的颜色——读作神秘、高贵,又带一点不真实的距离感(紫=神秘/灵性)。但这颗是灰扑扑的烟紫,不是教堂玻璃那种艳紫;扎眼艳紫≠这种蒙了雾的紫——后者读起来更内省、更\"夜里一个人想事\"。","benefit":"它不让你冷静下来——是给\"上头之后还想把自己拽回来\"的那个动作一个落点。给那种容易被情绪带着走、事后又懊恼的人:把这颗灰紫摆在手腕上看得见的地方,提醒自己慢半拍再决定。","element":"补火(el=fire)。盘偏冷、缺一点向上的精神劲时点它;但它是收着的火,不是烧旺,是\"亮一盏小灯\"那种。"},{"id":"jx-094","cn":"乌拉圭紫晶","en":"Amethyst","el":"fire","color":"purple","wish":["calm","energy","focus","intuition","sleep_light"],"teaser":"它不让你睡好、也不替你想清楚——是给\"想从喧闹里退半步、把脑子静下来\"的那一面一个看得见的落点","material":"乌拉圭紫晶:深一档的葡萄紫,不是淡香芋那种甜紫——明度压得低(偏暗)、彩度还在,所以看着是\"沉下去的紫\",有酒一样的厚。乌拉圭料以色浓均匀出名,通透里裹着点雾感,转一下能看见内部颜色的浓淡分层。这是这串里最\"有重量\"的一颗深色,深紫近黑≠亮丁香紫,别指望它跳出来——它是往里压的那种紫。","tradition":"(传统说法,非科学)紫水晶在西方 lore 里长期系着\"清醒、节制、定心\"——古希腊语词源就跟\"不上头/不沉醉\"有关;在水晶传统里它又常被摆在\"直觉、安神、助眠\"那一类。这些是民俗象征,不是疗效。","colorPsych":"(Heller)紫=最被读作神秘与高贵的颜色,介于热的红与冷的蓝之间,所以它两头都沾一点——既不张扬也不冷淡。而这颗是深紫:深紫比亮紫更\"收\",读起来是\"安静的贵气\",像夜里那一格,不是舞台灯。","benefit":"它不让你睡好、也不替你想清楚——是给\"想从喧闹里退半步、把脑子静下来\"的那一面一个看得见的落点。给那种白天被太多声音填满、想要一小块只属于自己的安静的人:深紫这一颗,就是你给自己留的那格夜色。","element":"补火(系统内 el=fire;紫为红蓝之间,这颗作暖中带收的一点火,给盘偏冷/想要安静而非燥热的人)。"},{"id":"jx-095","cn":"阿富汗紫锂辉","en":"Kunzite","el":"fire","color":"purple","wish":["calm","energy","focus","intuition","sleep_light"],"teaser":"它不让你松弛——是给\"已经绷了太久、想软下来但怕一软就垮\"的人,一个看得见的落点","material":"极淡的丁香紫偏粉,几乎是\"水里化开的一点紫\"——lch 亮度高、彩度很低(L79/C11),所以它不是浓紫,是那种透亮、清浅、像被水稀释过的颜色。锂辉石本身玻璃质、透得很,光从里头穿过去是温的;转个角度,那点紫会忽深忽淡(锂辉典型的\"换个方向变色\")。一串里它是最轻、最不抢戏的浅色珠,放多了整串会发空,要靠它来\"留白\"而不是来撑色。","tradition":"(传统说法,非科学)紫锂辉(Kunzite/锂辉石)在通行的水晶 lore 里被归到\"心轮、柔软、安抚情绪\"那一类——常被说成\"放下硬撑、接纳自己\"的石头;偏紫的色相又借了紫水晶系\"安神、直觉、夜里安定\"的旧说法。具体阿富汗这一产地的特性,保守说:就是浅紫锂辉,别的精确功效不编。","colorPsych":"(Heller)紫=神秘与高贵那一挂,但这颗不是浓紫的\"距离感\"——它淡到几乎是浅丁香,读起来更接近\"温柔、私密、不设防\"。浅紫近敌切分:深紫读作\"高高在上\",这种被水稀释的浅紫读作\"我可以软一点\"。一个点:它是整串里负责\"喘口气\"的颜色。","benefit":"它不让你松弛——是给\"已经绷了太久、想软下来但怕一软就垮\"的人,一个看得见的落点。那点化在水里的浅紫摆在腕上,提醒的是:你不必一直撑着。给那种习惯硬扛、其实早就想喘口气的人:允许自己浅一点、轻一点。","element":"补火(盘偏冷、缺一点暖意与生机),但它是\"温火\"不是\"旺火\"——el 虽属火,色与质都偏柔,给那种需要回暖、又受不了刺激的偏冷盘当过渡。"},{"id":"jx-096","cn":"紫锂辉水晶手串","en":"Kunzite","el":"fire","color":"purple","wish":["calm","energy","focus","intuition","sleep_light"],"teaser":"它不让你平静下来——是给'想软一点、又不想垮掉'的那一面一个落点","material":"很浅的丁香紫偏粉,半透里带一点乳感——不是浓紫,是被冲淡过的淡紫(L69、彩度只有20,库里最'轻'的颜色之一)。光打进去是柔的、散的,没有锐利的火彩。注意:'紫锂辉水晶'是市场叫法,它其实是锂辉石(spodumene)不是水晶,颜色天生就淡、还怕晒久了褪——到手就是这种安静的浅紫,不会比预览更艳。","tradition":"(传统说法 lore,非科学)锂辉石/紫锂辉在西方水晶圈被归到'心轮—顶轮之间'的石头,传统associations讲的是温柔的爱、放下情绪包袱、安神;淡紫色在更广的传统里一向系着'静、灵性、往里收'。库里没有这具体品种的考据,以上按紫锂辉大类的公认说法,当lore看,别当药。","colorPsych":"(Heller/通用色彩心理)紫=神秘、高贵、也最常被读作'灵性与想象';但这颗是被冲淡的浅丁香紫,不是深紫的神秘感——淡紫读起来更接近'温柔、克制、有点梦',是那种不抢话的颜色。一个点:它的高级感全在'淡',浓一分就俗。","benefit":"它不让你平静下来——是给'想软一点、又不想垮掉'的那一面一个落点。给那种白天绷着、晚上脑子停不下来的人:把这点很轻的紫摆在手腕上看得见的地方,提醒自己今天可以松半格。","element":"补火(el=fire;给盘偏冷、行动力或热情不足的人)。注:它颜色虽淡,本系统按属性归火,内部用,补的是'暖起来'那一格。"},{"id":"jx-097","cn":"紫水晶","en":"Amethyst","el":"fire","color":"purple","wish":["calm","energy","focus","intuition","sleep_light"],"teaser":"它不让你睡得着、也不让你更\"通透\"——是给\"想静下来、又不想被吵醒的脑子\"一个落点","material":"深紫近墨,带点灰调的那种闷紫——L 才 32,彩度也不高,所以它不是橱窗里那种亮晶晶的葡萄紫,而是看着深、看着沉的一颗。透光时紫里隐约泛点冷调,光线弱的时候几乎看成黑紫。是会\"压住场子\"的颜色,一串里多放几颗就显厚,少放就提神。","tradition":"(传统说法,非科学)紫水晶在西方 lore 里长期跟\"清醒、不上头\"绑在一起,古希腊拿它配酒杯求\"喝不醉\";到了中式与冥想传统,它更多系在第三眼、直觉、安神助眠上。综合公认说法:它代表\"往里收的清醒\"——醒着的那种静,不是兴奋。","colorPsych":"(Heller)紫是最少见、最被读作神秘与高贵的颜色——蓝的冷静加了红的内劲,天然带一点\"不轻易给人看透\"。而这颗是发灰的深紫≠张扬的亮紫:它读起来不是\"看我多特别\",是\"我自己知道就好\"。","benefit":"它不让你睡得着、也不让你更\"通透\"——是给\"想静下来、又不想被吵醒的脑子\"一个落点。给那种白天话太多、夜里关不掉的人:把这点深紫放在手腕上低头能看见的地方,提醒自己——有些清醒,是往里收的。","element":"补火(el=fire;盘偏冷/缺一点内在热度时点上),但它是收着的暖紫,不张扬,适合既想添火又怕太冲的盘。"}]</script>
<script>(function(){
  var root=document.currentScript.closest('.sw-lib-root')||document;
  var DATA=JSON.parse(root.querySelector('#swStoneData').textContent);
  var EL={"metal": {"en": "Metal", "c": "#C9C6D6"}, "wood": {"en": "Wood", "c": "#2E8B84"}, "water": {"en": "Water", "c": "#8AC2E2"}, "fire": {"en": "Fire", "c": "#C97987"}, "earth": {"en": "Earth", "c": "#E3BC77"}}, IMG="/tools/sw-crystal-customizer/beadwork/beads";
  var FIELD=[['material','Material — what it actually is'],['tradition','Tradition'],['colorPsych','Colour'],['benefit',"What it's for"],['element','Element role']];
  var grid=root.querySelector('#swLibGrid'), countEl=root.querySelector('#swLibCount');
  var drawer=root.querySelector('#swDrawer');
  var fEl=new Set(), fWish=new Set();
  function img(id){return IMG+'/'+id+'.png';}
  function match(s){return (fEl.size===0||fEl.has(s.el)) && (fWish.size===0||s.wish.some(function(w){return fWish.has(w);}));}
  function render(){
    var list=DATA.filter(match);
    countEl.textContent=list.length+' of '+DATA.length+' stones';
    if(!list.length){grid.innerHTML='<p class="sw-lib__empty">No stone matches all of those. Loosen a filter.</p>';return;}
    grid.innerHTML=list.map(function(s){
      var c=(EL[s.el]||{}).c||'#888';
      return '<button class="sw-card" data-id="'+s.id+'" style="--elc:'+c+'">'
        +'<span class="sw-card__el">'+((EL[s.el]||{}).en||s.el)+'</span>'
        +'<img class="sw-card__bead" loading="lazy" src="'+img(s.id)+'" alt="'+s.en+'">'
        +'<p class="sw-card__name">'+s.en+'</p>'
        +'<p class="sw-card__teaser">'+(s.teaser||'')+'</p>'
        +'</button>';
    }).join('');
  }
  function openDrawer(s){
    var c=(EL[s.el]||{}).c||'#888';
    var tags='<span class="sw-tag sw-tag--el" style="--elc:'+c+'">'+((EL[s.el]||{}).en||s.el)+'</span>'
      +s.wish.map(function(w){return '<span class="sw-tag">'+w+'</span>';}).join('');
    var fields=FIELD.map(function(f){var v=s[f[0]];return v?'<div class="sw-field"><p class="sw-field__k">'+f[1]+'</p><p class="sw-field__v">'+v+'</p></div>':'';}).join('');
    drawer.querySelector('.sw-drawer__panel').style.setProperty('--elc',c);
    drawer.querySelector('#swDBody').innerHTML=
      '<img class="sw-drawer__bead" src="'+img(s.id)+'" alt="'+s.en+'">'
      +'<h2 class="sw-drawer__name">'+s.en+'</h2><p class="sw-drawer__cn">'+s.cn+'</p>'
      +'<div class="sw-drawer__tags">'+tags+'</div>'+fields
      +'<a class="sw-drawer__cta" href="/pages/studio?stone='+s.id+'">Build with this stone →</a>';
    drawer.classList.add('open');document.body.style.overflow='hidden';
  }
  function close(){drawer.classList.remove('open');document.body.style.overflow='';}
  grid.addEventListener('click',function(e){var b=e.target.closest('.sw-card');if(!b)return;var s=DATA.find(function(x){return x.id===b.dataset.id;});if(s)openDrawer(s);});
  drawer.addEventListener('click',function(e){if(e.target.classList.contains('sw-drawer__scrim')||e.target.classList.contains('sw-drawer__x'))close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
  root.querySelectorAll('.sw-chip').forEach(function(ch){
    ch.addEventListener('click',function(){
      var on=ch.getAttribute('aria-pressed')==='true';ch.setAttribute('aria-pressed',!on);
      var set=ch.dataset.facet==='el'?fEl:fWish;on?set.delete(ch.dataset.val):set.add(ch.dataset.val);render();
    });
  });
  render();
})();</script>
</div>


</body></html>
